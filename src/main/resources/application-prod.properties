# PERFIL PROD — Producción

# Thymeleaf con cache para performance
spring.thymeleaf.cache=true

# DevTools deshabilitado en producción
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# app.seed hereda de application.properties (false) — no hace falta repetirlo acá.

# Logs solo WARN+ en producción (mongodb/thymeleaf ya son WARN por defecto en application.properties)
logging.level.com.residuosolido.app=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN

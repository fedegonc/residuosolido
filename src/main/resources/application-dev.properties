# PERFIL DEV — Desarrollo local

# MongoDB: la URI se hereda de application.properties (${SPRING_DATA_MONGODB_URI}),
# que a su vez la lee de .env en la raíz del repo (ver .env.example). No hardcodear
# credenciales acá — ver docs/DEFENSA.md §26.

# Thymeleaf sin cache para hot reload
spring.thymeleaf.cache=false

# DevTools habilitado
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/resources/templates,src/main/resources/static
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=400

# app.seed hereda de application.properties (false) — no hace falta repetirlo acá.

# Logs más verbose en desarrollo
logging.level.com.residuosolido.app=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.data.mongodb=INFO

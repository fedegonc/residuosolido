<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>
  <div th:fragment="field(id, name, hintI18nKey, hintDefault)" class="form-group">
    <label th:for="${id}" data-i18n="auth_password">Contraseña</label>
    <div class="password-field">
      <i class="fa-solid fa-lock password-field__icon" aria-hidden="true"></i>
      <input type="password" th:id="${id}" th:name="${name}" required placeholder=" " class="form-input password-field__input">
      <button type="button" class="password-field__toggle" th:attr="data-toggle-target=${id}"
              aria-label="Mostrar u ocultar contraseña" aria-pressed="false">
        <i class="fa-solid fa-eye" aria-hidden="true"></i>
      </button>
    </div>
    <small th:if="${hintDefault != null}" class="form-hint" th:attr="data-i18n=${hintI18nKey}" th:text="${hintDefault}"></small>
  </div>
</body>
</html>

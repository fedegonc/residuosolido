<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>
  <!-- PIN de 4 dígitos en vez de contraseña — fricción mínima para pruebas,
       ver docs/DEFENSA.md §24. -->
  <div th:fragment="field(id, name, hintI18nKey, hintDefault)" class="field">
    <label th:for="${id}" data-i18n="auth_pin">PIN</label>
    <div class="password-field">
      <i class="fa-solid fa-lock" aria-hidden="true"></i>
      <input type="password" th:id="${id}" th:name="${name}" required placeholder=" " class="password-field__input"
             maxlength="4" pattern="[0-9]{4}" inputmode="numeric" autocomplete="off">
      <button type="button" class="password-field__toggle" th:attr="data-toggle-target=${id}"
              aria-label="Mostrar u ocultar PIN" aria-pressed="false">
        <i class="fa-solid fa-eye" aria-hidden="true"></i>
      </button>
    </div>
    <span th:if="${hintDefault != null}" class="hint" th:attr="data-i18n=${hintI18nKey}" th:text="${hintDefault}"></span>
  </div>
</body>
</html>

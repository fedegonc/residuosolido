<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"></head>
<body>
  <nav th:fragment="navbar" class="navbar" th:aria-label="#{aria.navbar.label}">
    <div class="navbar__inner">
      <a href="/" class="navbar__brand">
        <span class="navbar__logo">
          <svg aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </span>
        Residuo Sólido
      </a>
      <button id="menuBtn" type="button" class="navbar__toggle" th:aria-label="#{aria.menu.toggle}" aria-expanded="false">
        <svg id="menuIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        <svg id="closeIcon" class="is-hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Guest dropdown -->
    <div sec:authorize="!isAuthenticated()" id="dropdownMenu" class="dropdown is-hidden">
      <div th:replace="~{fragments/lang-switch :: switch}"></div>
      <a href="/" class="dropdown__link" th:text="#{navbar.guest.home}">Inicio</a>
      <a href="/rastrear" class="dropdown__link" th:text="#{track.title}">Rastrear solicitud</a>
      <div class="dropdown__divider">
        <a href="/auth/login" class="btn btn--login" th:text="#{navbar.guest.login}">Entrar</a>
        <a href="/auth/register" class="btn btn--register" th:text="#{navbar.guest.register}">Registrarse</a>
      </div>
    </div>

    <!-- Auth dropdown -->
    <div sec:authorize="isAuthenticated()" id="dropdownMenuAuth" class="dropdown is-hidden">
      <div class="dropdown__section">
        <p class="dropdown__label" th:text="#{navbar.user.user_label}">Usuario</p>
        <p class="dropdown__user" sec:authentication="name">Usuario</p>
      </div>
      <div th:replace="~{fragments/lang-switch :: switch}"></div>
      <a href="/" class="dropdown__link" th:text="#{navbar.guest.auth.home}">Inicio</a>
      <div class="dropdown__divider">
        <a href="/" class="btn btn--green" th:text="#{navbar.guest.auth.public_info}">Ver Información Pública</a>
      </div>
      <div class="dropdown__divider">
        <form th:action="@{/logout}" method="POST">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="btn btn--logout" th:text="#{navbar.guest.auth.logout}">Cerrar sesión</button>
        </form>
      </div>
    </div>

    <script>
      const btn = document.getElementById('menuBtn');
      const menu = document.getElementById('dropdownMenu');
      const menuAuth = document.getElementById('dropdownMenuAuth');
      const menuIcon = document.getElementById('menuIcon');
      const closeIcon = document.getElementById('closeIcon');

      btn?.addEventListener('click', () => {
        menu?.classList.toggle('is-hidden');
        menuAuth?.classList.toggle('is-hidden');
        menuIcon?.classList.toggle('is-hidden');
        closeIcon?.classList.toggle('is-hidden');
        btn.setAttribute('aria-expanded', String(!menu?.classList.contains('is-hidden')));
      });

      document.querySelectorAll('.lang-switch__btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const menu = btn.nextElementSibling;
          document.querySelectorAll('.lang-switch__menu').forEach(m => { if (m !== menu) m.classList.add('is-hidden'); });
          menu?.classList.toggle('is-hidden');
          btn.setAttribute('aria-expanded', String(!menu?.classList.contains('is-hidden')));
        });
      });

      document.addEventListener('click', (e) => {
        if (!btn?.contains(e.target) && !menu?.contains(e.target) && !menuAuth?.contains(e.target)) {
          menu?.classList.add('is-hidden');
          menuAuth?.classList.add('is-hidden');
          menuIcon?.classList.remove('is-hidden');
          closeIcon?.classList.add('is-hidden');
        }
        document.querySelectorAll('.lang-switch__menu').forEach(m => {
          if (!m.contains(e.target) && !m.previousElementSibling?.contains(e.target)) m.classList.add('is-hidden');
        });
      });
    </script>
  </nav>
</body>
</html>

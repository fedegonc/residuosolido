<html xmlns:th="http://www.thymeleaf.org">
<body>

  <div th:fragment="request-item-card(req)" class="request-item">
    <div class="request-item__header">
      <span><span data-i18n="track_request_id">Solicitud</span> #<span th:text="${req.id}"></span></span>
      <div th:replace="~{fragments/ui :: status(${req.status})}"></div>
    </div>
    <div class="info-row" th:if="${req.createdAt != null}">
      <svg class="icon"><use href="/images/icons.svg#calendar"/></svg>
      <span th:text="${#temporals.format(req.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
    </div>
    <div class="info-row" th:if="${req.contactName != null}">
      <svg class="icon"><use href="/images/icons.svg#user"/></svg>
      <span th:text="${req.contactName}"></span>
    </div>
    <div class="info-row" th:if="${req.contactPhone != null}">
      <svg class="icon"><use href="/images/icons.svg#phone"/></svg>
      <span th:text="${req.contactPhone}"></span>
    </div>
    <div class="info-row" th:if="${req.city != null}">
      <svg class="icon"><use href="/images/icons.svg#location-dot"/></svg>
      <span th:text="${req.city}"></span>
    </div>
    <div class="info-row" th:if="${req.address != null and !req.address.isBlank()}">
      <svg class="icon"><use href="/images/icons.svg#route"/></svg>
      <span th:text="${req.address}"></span>
    </div>
    <div th:if="${req.hasMaterials()}" class="request-item__materials">
      <span th:each="mat : ${req.materials}" class="tag" th:text="${mat.name()}"></span>
    </div>
    <div class="info-row" th:if="${req.organization != null}">
      <svg class="icon"><use href="/images/icons.svg#building"/></svg>
      <span th:text="${req.organization.displayName}"></span>
    </div>
    <div class="info-row" th:if="${req.organization == null}">
      <svg class="icon"><use href="/images/icons.svg#building"/></svg>
      <span data-i18n="track_no_org">Sin asignar</span>
    </div>
  </div>

  <!-- Fila compacta para el panel de organización — mismo dato que
       request-item-card de arriba, en una sola fila en vez de 6-7 líneas
       apiladas. No reemplaza el fragment de arriba: users/requests.html
       sigue usando el original, este es exclusivo de org/requests.html. -->
  <div th:fragment="request-item-row(req)" class="org-panel__row">
    <div class="info-row" th:if="${req.createdAt != null}" style="padding:0">
      <span th:text="${#temporals.format(req.createdAt, 'dd/MM/yy HH:mm')}"></span>
    </div>
    <div th:unless="${req.createdAt != null}">—</div>
    <div th:replace="~{fragments/ui :: status(${req.status})}"></div>
    <div class="org-panel__cell--contact">
      <span th:text="${req.contactName != null ? req.contactName : '—'}"></span>
      <span th:text="${req.contactPhone}"></span>
    </div>
    <div class="org-panel__cell--address" th:text="${req.address}"></div>
    <div class="org-panel__cell--actions">
      <a th:href="@{/acopio/solicitudes/{id}(id=${req.id})}" class="btn btn--outline btn--sm">
        <svg class="icon"><use href="/images/icons.svg#eye"/></svg> <span data-i18n="req_list_view">Ver</span>
      </a>
    </div>
  </div>

</body>
</html>

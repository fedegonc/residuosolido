<html xmlns:th="http://www.thymeleaf.org">
<body>

  <div th:fragment="request-item-card(req)" class="request-item">
    <div class="request-item__header">
      <span><span data-i18n="track_request_id">Solicitud</span> #<span th:text="${req.id}"></span></span>
      <div th:replace="~{fragments/ui :: status(${req.status})}"></div>
    </div>
    <div class="info-row" th:if="${req.createdAt != null}">
      <i class="fa-solid fa-calendar"></i>
      <span th:text="${#temporals.format(req.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
    </div>
    <div class="info-row" th:if="${req.contactName != null}">
      <i class="fa-solid fa-user"></i>
      <span th:text="${req.contactName}"></span>
    </div>
    <div class="info-row" th:if="${req.contactPhone != null}">
      <i class="fa-solid fa-phone"></i>
      <span th:text="${req.contactPhone}"></span>
    </div>
    <div class="info-row" th:if="${req.city != null}">
      <i class="fa-solid fa-location-dot"></i>
      <span th:text="${req.city}"></span>
    </div>
    <div class="info-row" th:if="${req.address != null and !req.address.isBlank()}">
      <i class="fa-solid fa-route"></i>
      <span th:text="${req.address}"></span>
    </div>
    <div th:if="${req.hasMaterials()}" class="request-item__materials">
      <span th:each="mat : ${req.materials}" class="tag" th:text="${mat.name()}"></span>
    </div>
    <div class="info-row" th:if="${req.organization != null}">
      <i class="fa-solid fa-building"></i>
      <span th:text="${req.organization.displayName}"></span>
    </div>
    <div class="info-row" th:if="${req.organization == null}">
      <i class="fa-solid fa-building"></i>
      <span data-i18n="track_no_org">Sin asignar</span>
    </div>
  </div>

</body>
</html>

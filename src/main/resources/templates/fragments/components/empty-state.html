<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="state(icon, title, text)" class="empty-state">
    <i th:class="${'fa-solid ' + icon + ' empty-state__icon'}"></i>
    <h3 th:if="${title != null}" class="text-lg font-medium" th:text="${title}">No results</h3>
    <p th:if="${text != null}" th:text="${text}">No items found.</p>
  </div>
</body>
</html>

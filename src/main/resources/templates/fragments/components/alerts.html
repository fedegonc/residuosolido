<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="success(message)" class="alert alert--success" role="status" aria-live="polite">
    <i aria-hidden="true" class="fa-solid fa-circle-check"></i>
    <span th:text="${message}">Operación completada.</span>
    <button type="button" class="alert__close" onclick="this.parentElement.remove()" th:aria-label="#{aria.close}">&times;</button>
  </div>

  <div th:fragment="error(message)" class="alert alert--error" role="alert" aria-live="assertive">
    <i aria-hidden="true" class="fa-solid fa-circle-xmark"></i>
    <span th:text="${message}">Se produjo un error.</span>
    <button type="button" class="alert__close" onclick="this.parentElement.remove()" th:aria-label="#{aria.close}">&times;</button>
  </div>

  <div th:fragment="warning(message)" class="alert alert--warning" role="status" aria-live="polite">
    <i aria-hidden="true" class="fa-solid fa-triangle-exclamation"></i>
    <span th:text="${message}">Advertencia.</span>
    <button type="button" class="alert__close" onclick="this.parentElement.remove()" th:aria-label="#{aria.close}">&times;</button>
  </div>

  <div th:fragment="info(message)" class="alert alert--info" role="status" aria-live="polite">
    <i aria-hidden="true" class="fa-solid fa-circle-info"></i>
    <span th:text="${message}">Información.</span>
    <button type="button" class="alert__close" onclick="this.parentElement.remove()" th:aria-label="#{aria.close}">&times;</button>
  </div>

  <div th:fragment="flash(message, type)" class="alert" th:id="${'flash-alert'}" role="status" aria-live="polite"
       th:classappend="${type == 'success' ? 'alert--success' : (type == 'error' ? 'alert--error' : (type == 'warning' ? 'alert--warning' : 'alert--info'))}">
    <i aria-hidden="true" th:class="${'fa-solid ' + (type == 'success' ? 'fa-circle-check' : (type == 'error' ? 'fa-circle-xmark' : (type == 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-info')))}"></i>
    <span th:text="${message}">Mensaje</span>
    <script>
      setTimeout(function() {
        var el = document.getElementById('flash-alert');
        if (el) { el.classList.add('alert--fade-out'); setTimeout(function() { el.remove(); }, 1000); }
      }, 5000);
    </script>
  </div>
</body>
</html>

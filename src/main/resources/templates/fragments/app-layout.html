<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Residuo Sólido">Residuo Sólido</title>
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/webjars/fortawesome__fontawesome-free/6.5.2/css/all.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.1.0/css/flag-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2316a34a'%3E%3Cpath d='M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15'/%3E%3C/svg%3E">
</head>
<body class="app-body">

    <a href="#main-content" class="skip-link" th:text="#{accessibility.skip_to_content}">Saltar al contenido</a>

    <th:block sec:authorize="isAuthenticated()" th:replace="~{fragments/navbar-app :: navbar}"></th:block>
    <th:block sec:authorize="isAnonymous()" th:replace="~{fragments/navbar-guest :: navbar}"></th:block>

    <main class="app-main" id="main-content">
        <th:block layout:fragment="content"></th:block>
    </main>

    <footer sec:authorize="isAuthenticated()" class="site-footer">
      <div class="footer-inner">
        <span class="footer-copy" th:text="#{footer.copy}">&copy; 2024 EcoSolicitud</span>
        <nav class="footer-nav"></nav>
      </div>
    </footer>
    <footer sec:authorize="isAnonymous()" class="site-footer">
      <div class="footer-inner">
        <span class="footer-copy">&copy; <span th:text="${#temporals.format(#temporals.createNow(),'yyyy')}">2025</span> <span th:text="#{footer.copy}">Resíduos Sólidos</span></span>
      </div>
    </footer>
    <script>
    (function(){
      document.addEventListener('click', function(e){
        var btn = e.target.closest('[data-password-toggle]');
        if(!btn) return;
        e.preventDefault();
        var targetId = btn.getAttribute('data-target');
        var input = document.getElementById(targetId);
        if(!input) return;
        var isPwd = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPwd ? 'text' : 'password');
        btn.setAttribute('aria-pressed', String(isPwd));
        var icon = btn.querySelector('i');
        if(icon){
          icon.classList.toggle('fa-eye');
          icon.classList.toggle('fa-eye-slash');
        }
      });
    })();
    </script>
</body>
</html>

<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
  <!-- Botón "Mis solicitudes" para invitados (abre el modal de rastreo vía HTMX).
       Se repite en el nav de desktop y en el dropdown mobile — parametrizado por
       clase para no duplicar el markup en los 2 lugares. -->
  <button th:fragment="trackButtonDesktop" sec:authorize="!isAuthenticated()" type="button" class="navbar__link navbar__link--btn"
          hx-get="/rastrear" hx-target="#trackModal" hx-swap="innerHTML">
    <span data-i18n="nav_my_requests">Mis solicitudes</span>
    <i class="fa-solid fa-spinner fa-spin htmx-indicator" aria-hidden="true"></i>
  </button>
  <button th:fragment="trackButtonMobile" sec:authorize="!isAuthenticated()" type="button" class="dropdown__link dropdown__link--btn"
          hx-get="/rastrear" hx-target="#trackModal" hx-swap="innerHTML">
    <span data-i18n="nav_my_requests">Mis solicitudes</span>
    <i class="fa-solid fa-spinner fa-spin htmx-indicator" aria-hidden="true"></i>
  </button>

  <nav th:fragment="nav" class="navbar" aria-label="Navegación principal">
    <div class="navbar__inner">
      <a href="/" class="navbar__brand">
        <span class="navbar__logo"><i class="fa-solid fa-recycle"></i></span>
        <span>Eco Solicitud</span>
      </a>

      <div class="navbar__links">
        <a href="/" class="navbar__link" data-i18n="nav_home">Inicio</a>
        <a sec:authorize="!hasRole('ORGANIZATION')" href="/solicitudes/nueva" class="navbar__link" data-i18n="nav_request">Solicitar recolección</a>
        <a sec:authorize="hasRole('ORGANIZATION')" href="/acopio/inicio" class="navbar__link" data-i18n="nav_org_panel">Panel acopio</a>
        <a sec:authorize="hasRole('USER')" href="/solicitudes" class="navbar__link" data-i18n="nav_my_requests">Mis solicitudes</a>
        <th:block th:replace="~{::trackButtonDesktop}"></th:block>
      </div>

      <div class="navbar__actions">
        <div class="navbar__lang">
          <button type="button" class="navbar__lang-btn" data-lang="es" aria-label="Español">ES</button>
          <button type="button" class="navbar__lang-btn" data-lang="pt" aria-label="Português">PT</button>
        </div>

        <span sec:authorize="!isAuthenticated()" class="row">
          <a href="/auth/login" class="btn btn--primary" data-i18n="nav_login">Entrar</a>
          <a href="/auth/register" class="btn btn--outline" data-i18n="nav_register">Registrarse</a>
        </span>

        <details sec:authorize="isAuthenticated()" class="navbar__user">
          <summary class="navbar__user-info">
            <span class="navbar__user-avatar"><i class="fa-solid fa-user"></i></span>
            <span class="navbar__user-name" sec:authentication="name">usuario</span>
          </summary>
          <div class="navbar__menu">
            <a sec:authorize="hasRole('ORGANIZATION')" href="/acopio/inicio" data-i18n="nav_org_panel">Panel acopio</a>
            <a sec:authorize="hasRole('ORGANIZATION')" href="/acopio/perfil" data-i18n="nav_org_profile">Perfil</a>
            <a sec:authorize="hasRole('USER')" href="/solicitudes" data-i18n="nav_my_requests">Mis solicitudes</a>
            <form th:action="@{/logout}" method="post">
              <button type="submit" class="btn btn--block" data-i18n="nav_logout">Cerrar sesión</button>
            </form>
          </div>
        </details>
      </div>

      <details class="navbar__mobile">
        <summary class="navbar__toggle" aria-label="Menú">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </summary>
        <div class="dropdown">
          <a href="/" class="dropdown__link" data-i18n="nav_home">Inicio</a>
          <a sec:authorize="!hasRole('ORGANIZATION')" href="/solicitudes/nueva" class="dropdown__link" data-i18n="nav_request">Solicitar recolección</a>
          <a sec:authorize="hasRole('ORGANIZATION')" href="/acopio/inicio" class="dropdown__link" data-i18n="nav_org_panel">Panel acopio</a>
          <a sec:authorize="hasRole('USER')" href="/solicitudes" class="dropdown__link" data-i18n="nav_my_requests">Mis solicitudes</a>
          <th:block th:replace="~{::trackButtonMobile}"></th:block>
          <div class="dropdown__divider">
            <div class="dropdown__lang-row">
              <button type="button" class="navbar__lang-btn" data-lang="es" aria-label="Español">ES</button>
              <button type="button" class="navbar__lang-btn" data-lang="pt" aria-label="Português">PT</button>
            </div>
          </div>
          <span sec:authorize="!isAuthenticated()" class="dropdown__auth">
            <a href="/auth/login" class="btn btn--primary btn--block" data-i18n="nav_login">Entrar</a>
            <a href="/auth/register" class="btn btn--outline btn--block" data-i18n="nav_register">Registrarse</a>
          </span>
          <div sec:authorize="isAuthenticated()" class="dropdown__auth">
            <a sec:authorize="hasRole('ORGANIZATION')" href="/acopio/inicio" class="dropdown__link" data-i18n="nav_org_panel">Panel acopio</a>
            <a sec:authorize="hasRole('ORGANIZATION')" href="/acopio/perfil" class="dropdown__link" data-i18n="nav_org_profile">Perfil</a>
            <a sec:authorize="hasRole('USER')" href="/solicitudes" class="dropdown__link" data-i18n="nav_my_requests">Mis solicitudes</a>
            <form th:action="@{/logout}" method="post">
              <button type="submit" class="btn btn--outline btn--block" data-i18n="nav_logout">Cerrar sesión</button>
            </form>
          </div>
        </div>
      </details>
    </div>

    <div id="trackModal"></div>
  </nav>
</body>
</html>

<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="state(icon, messageKey, message)" class="empty-state">
    <svg class="icon" aria-hidden="true"><use th:attr="href=@{/images/icons.svg} + '#' + ${icon}"/></svg>
    <span class="empty-state__text" th:attr="data-i18n=${messageKey}" th:text="${message}">No hay elementos</span>
  </div>

  <th:block th:fragment="status(status)">
    <span class="badge"
          th:classappend="'badge--' + ${#strings.toLowerCase(status.name())}"
          th:text="${status}">PENDING</span>
  </th:block>

  <div th:fragment="row(icon, label, value)" th:if="${value != null}" class="info-row">
    <svg class="icon" aria-hidden="true"><use th:attr="href=@{/images/icons.svg} + '#' + ${icon}"/></svg>
    <span class="info-row__label" th:text="${label}">Label</span>
    <span class="info-row__value" th:text="${value}">Value</span>
  </div>

  <div th:fragment="tile(icon, value, labelKey, labelText)" class="stat-card">
    <div class="stat-card__icon"><svg class="icon"><use th:attr="href=@{/images/icons.svg} + '#' + ${icon}"/></svg></div>
    <span class="stat-card__value" th:text="${value}">0</span>
    <span class="stat-card__label" th:attr="data-i18n=${labelKey}" th:text="${labelText}">Label</span>
  </div>

  <th:block th:fragment="options">
    <option th:if="${organizations == null or organizations.isEmpty()}" value="" disabled selected
            data-i18n="req_form_org_none">No hay organizaciones en esta ciudad</option>
    <option th:unless="${organizations == null or organizations.isEmpty()}" value=""
            data-i18n="req_form_org_select">Seleccioná una organización</option>
    <option th:each="org : ${organizations}" th:value="${org.id}"
            th:attr="data-materials=${org.acceptedMaterialsCsv}"
            th:text="${org.displayName}"></option>
  </th:block>

  <div th:fragment="msg(type, text)" th:if="${type != null and text != null}"
       class="alert"
       th:classappend="'alert--' + ${type}"
       role="alert"
       th:with="icon=${type == 'success' ? 'circle-check' : (type == 'error' ? 'circle-exclamation' : (type == 'warning' ? 'triangle-exclamation' : 'circle-info'))}">
    <svg class="icon" aria-hidden="true"><use th:attr="href=@{/images/icons.svg} + '#' + ${icon}"/></svg>
    <span th:text="${text}"></span>
  </div>

  <nav th:fragment="trail(crumbs)" class="breadcrumb" aria-label="Ruta de navegación">
    <th:block th:each="crumb, iter : ${crumbs}">
      <a th:if="${crumb.href != ''}" th:href="${crumb.href}" th:text="${crumb.label}">Inicio</a>
      <span th:unless="${crumb.href != ''}" th:text="${crumb.label}">Actual</span>
      <svg th:if="${!iter.last}" class="icon breadcrumb__sep" aria-hidden="true"><use href="/images/icons.svg#chevron-right"/></svg>
    </th:block>
  </nav>

  <div th:fragment="greeting(greetingKey, greetingText, name, exclamation, subtitleKey, subtitleText)">
    <h1 class="card__title">
      <span th:attr="data-i18n=${greetingKey}" th:text="${greetingText}"></span>,
      <span th:text="${name}"></span><span th:if="${exclamation}">!</span>
    </h1>
    <p class="hint" th:attr="data-i18n=${subtitleKey}" th:text="${subtitleText}"></p>
  </div>

  <!-- Links compactos a las páginas de contenido educativo (/pagina/{slug}), menor
       jerarquía que el contenido principal del dashboard — mismo dato que las landing
       cards de "/" (LandingCardLoader), un usuario logueado nunca ve esa página. -->
  <section th:fragment="educationalLinks(cards)" class="edu-links" th:if="${cards != null and !cards.isEmpty()}">
    <span class="edu-links__label" data-i18n="dash_learn_more">También te puede interesar</span>
    <nav class="edu-links__nav">
      <a th:each="card : ${cards}" th:href="${card.href}" th:text="${card.title}" class="edu-links__link"></a>
    </nav>
  </section>
</body>
</html>

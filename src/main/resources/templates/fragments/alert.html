<html xmlns:th="http://www.thymeleaf.org">
<body>
  <div th:fragment="msg(type, text)" th:if="${type != null and text != null}"
       class="alert"
       th:classappend="'alert--' + ${type}"
       role="alert">
    <i aria-hidden="true" th:class="${type == 'success' ? 'fa-solid fa-circle-check' : (type == 'error' ? 'fa-solid fa-circle-exclamation' : (type == 'warning' ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-circle-info'))}"></i>
    <span th:text="${text}"></span>
  </div>
</body>
</html>

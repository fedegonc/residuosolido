<div th:fragment="switch" class="lang-switch" xmlns:th="http://www.thymeleaf.org">
  <button type="button" class="lang-switch__btn"
          th:id="${id != null ? id + 'Btn' : 'langBtn'}"
          aria-haspopup="true" aria-expanded="false">
    <span class="lang-switch__current">
      <span class="fi" th:classappend="${#locale.language == 'pt' or #locale.language == 'pt_BR' or #locale.language == 'pt-BR'} ? ' fi-br' : ' fi-uy'"></span>
      <span th:text="${#locale.language == 'pt' or #locale.language == 'pt_BR' or #locale.language == 'pt-BR'} ? 'Português' : 'Español'">Español</span>
    </span>
    <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
  </button>
  <div class="lang-switch__menu is-hidden"
       th:id="${id != null ? id + 'Menu' : 'langMenu'}">
    <a href="?lang=es" class="lang-switch__option"
       th:classappend="${#locale.language == 'es' or #locale.language == 'es_ES'} ? ' lang-switch__option--active' : ''">
      <span class="fi fi-uy"></span> Español
    </a>
    <a href="?lang=pt" class="lang-switch__option"
       th:classappend="${#locale.language == 'pt' or #locale.language == 'pt_BR' or #locale.language == 'pt-BR'} ? ' lang-switch__option--active' : ''">
      <span class="fi fi-br"></span> Português
    </a>
  </div>
</div>

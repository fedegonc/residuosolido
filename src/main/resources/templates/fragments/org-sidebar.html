<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>
  <!-- Fragment: org sidebar navigation
       Variables: active (string: 'dashboard' | 'requests' | 'profile' | 'catadores') -->
  <aside th:fragment="sidebar(active)" class="org-sidebar" aria-label="Navegación de organización">
    <a href="/acopio/inicio" class="org-sidebar__link" th:classappend="${active == 'dashboard'} ? 'is-active'">
      <i class="fa-solid fa-gauge"></i>
      <span data-i18n="org_dash_title">Panel de acopio</span>
    </a>
    <a href="/acopio/requests" class="org-sidebar__link" th:classappend="${active == 'requests'} ? 'is-active'">
      <i class="fa-solid fa-list"></i>
      <span data-i18n="org_dash_requests">Solicitudes</span>
    </a>
    <a href="/acopio/catadores" class="org-sidebar__link" th:classappend="${active == 'catadores'} ? 'is-active'">
      <i class="fa-solid fa-users"></i>
      <span data-i18n="cat_title">Catadores</span>
    </a>
    <a href="/acopio/perfil" class="org-sidebar__link" th:classappend="${active == 'profile'} ? 'is-active'">
      <i class="fa-solid fa-building"></i>
      <span data-i18n="org_profile_title">Perfil de organización</span>
    </a>
  </aside>
</body>
</html>

<html xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- Landing cards renderizadas server-side (Thymeleaf, sin JS) -->
  <section th:fragment="section(cards)" class="landing-cards">
    <a th:each="card : ${cards}" th:href="${card.href}" class="landing-card">
      <img th:if="${card.image}" th:src="${card.image}" th:alt="${card.title}" class="landing-card__img" loading="lazy">
      <div class="landing-card__content">
        <h3 class="landing-card__title" th:text="${card.title}"></h3>
        <p class="landing-card__desc" th:text="${card.description}"></p>
      </div>
    </a>
  </section>
</body>
</html>

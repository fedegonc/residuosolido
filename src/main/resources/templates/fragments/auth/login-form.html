<!-- Fragmento de formulario de login -->
<section th:fragment="loginForm">
  <header class="auth-card__header">
    <h2 class="auth-card__title" th:text="#{nav.login}">Iniciar Sesión</h2>
  </header>

  <form th:action="@{/auth/login}" method="post" class="form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div class="field">
      <label class="field__label" for="username">
        <i class="fa-solid fa-user" aria-hidden="true"></i>
        <span th:text="#{login.username.label}">Usuario</span>
      </label>
      <input type="text" id="username" name="username" required
             class="input" th:placeholder="#{login.username.placeholder}">
    </div>

    <div class="field">
      <label class="field__label" for="password">
        <i class="fa-solid fa-lock" aria-hidden="true"></i>
        <span th:text="#{login.password.label}">Contraseña</span>
      </label>
      <div class="password-field" data-password-container>
        <input type="password" id="password" name="password" required
               class="input" th:placeholder="#{login.password.placeholder}">
        <button type="button" class="password-field__toggle"
                data-password-toggle data-target="password"
                th:aria-label="#{aria.password.toggle}" aria-pressed="false">
          <i class="fa-solid fa-eye" aria-hidden="true"></i>
          <span class="sr-only" th:text="#{auth.password.toggle}">Mostrar u ocultar contraseña</span>
        </button>
      </div>
    </div>

    <button type="submit" class="btn btn--green btn--block">
      <span th:text="#{nav.login}">Iniciar Sesión</span>
    </button>
  </form>

  <div class="mt-4 text-center">
    <p class="text-xs text-gray-600">
      <span th:text="#{login.no_account}">¿No tienes cuenta?</span>
      <a href="/auth/register" class="link link--green" th:text="#{login.register_link}">Regístrate aquí</a>
    </p>
  </div>
</section>

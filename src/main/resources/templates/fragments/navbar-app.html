<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"></head>
<body>
  <nav th:fragment="navbar" class="navbar" th:aria-label="#{aria.navbar.label}">
    <div class="navbar__inner">
      <a sec:authorize="hasRole('USER')" href="/usuarios/inicio" class="navbar__brand">
        <span class="navbar__logo"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></span>
        Residuo Sólido
      </a>
      <a sec:authorize="hasRole('ORGANIZATION')" href="/acopio/inicio" class="navbar__brand">
        <span class="navbar__logo"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></span>
        Residuo Sólido
      </a>
      <button id="menuBtn" type="button" class="navbar__toggle" th:aria-label="#{aria.menu.toggle}" aria-expanded="false">
        <svg id="menuIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        <svg id="closeIcon" class="is-hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <div id="dropdownMenu" class="dropdown is-hidden">
      <div class="dropdown__section">
        <p class="dropdown__label" sec:authorize="hasRole('USER')" th:text="#{navbar.user.user_label}">Usuario</p>
        <p class="dropdown__label" sec:authorize="hasRole('ORGANIZATION')" th:text="#{navbar.org.label}">Organización</p>
        <p class="dropdown__user" sec:authentication="name">Usuario</p>
      </div>

      <div th:replace="~{fragments/lang-switch :: switch}"></div>

      <th:block sec:authorize="hasRole('USER')">
        <a href="/usuarios/inicio" class="dropdown__link" th:text="#{navbar.user.home}">Área del Usuario</a>
        <a href="/" class="dropdown__link" th:text="#{navbar.user.public_info}">Información Pública</a>
        <a href="/solicitudes/nueva" class="dropdown__link" th:text="#{navbar.user.new_request}">Nueva Solicitud</a>
        <a href="/solicitudes" class="dropdown__link" th:text="#{navbar.user.my_requests}">Mis Solicitudes</a>
        <a href="/usuarios/perfil" class="dropdown__link" th:text="#{navbar.user.my_profile}">Mi Perfil</a>
        <div class="dropdown__divider">
          <a href="/reportes" class="btn btn--green btn--block" th:text="#{navbar.user.report_problem}">Reportar Problema</a>
        </div>
      </th:block>

      <th:block sec:authorize="hasRole('ORGANIZATION')">
        <a href="/acopio/inicio" class="dropdown__link" th:text="#{navbar.org.home}">Inicio</a>
        <a href="/" class="dropdown__link" th:text="#{navbar.org.public_info}">Información Pública</a>
        <a href="/acopio/requests" class="dropdown__link" th:text="#{navbar.org.requests}">Solicitudes</a>
        <a href="/acopio/perfil" class="dropdown__link" th:text="#{navbar.org.profile}">Perfil</a>
      </th:block>

      <div class="dropdown__divider">
        <form th:action="@{/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="btn btn--ghost btn--block" th:text="#{navbar.user.logout}">Cerrar sesión</button>
        </form>
      </div>
    </div>

    <script>
      const btn = document.getElementById('menuBtn');
      const menu = document.getElementById('dropdownMenu');
      const menuIcon = document.getElementById('menuIcon');
      const closeIcon = document.getElementById('closeIcon');

      btn?.addEventListener('click', () => {
        menu?.classList.toggle('is-hidden');
        menuIcon?.classList.toggle('is-hidden');
        closeIcon?.classList.toggle('is-hidden');
        btn.setAttribute('aria-expanded', String(!menu?.classList.contains('is-hidden')));
      });

      document.querySelectorAll('.lang-switch__btn').forEach(b => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          const m = b.nextElementSibling;
          document.querySelectorAll('.lang-switch__menu').forEach(x => { if (x !== m) x.classList.add('is-hidden'); });
          m?.classList.toggle('is-hidden');
          b.setAttribute('aria-expanded', String(!m?.classList.contains('is-hidden')));
        });
      });

      document.addEventListener('click', (e) => {
        if (!btn?.contains(e.target) && !menu?.contains(e.target)) {
          menu?.classList.add('is-hidden');
          menuIcon?.classList.remove('is-hidden');
          closeIcon?.classList.add('is-hidden');
        }
        document.querySelectorAll('.lang-switch__menu').forEach(m => {
          if (!m.contains(e.target) && !m.previousElementSibling?.contains(e.target)) m.classList.add('is-hidden');
        });
      });
    </script>
  </nav>
</body>
</html>

<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Inicio</title></head>
<body>
  <main layout:fragment="content">
    <div class="page page--center">
      <div class="split">
        <section class="hero">
          <img src="/images/hero/plaza-internacional.jpg" class="hero__img" alt="Plaza Internacional — frontera Rivera–Sant'Ana do Livramento" data-i18n-attr="alt:hero_img_alt">
          <h1 class="hero__title" data-i18n="title">Pedí que pasen a buscar tus <span>reciclables</span></h1>
          <p class="hero__subtitle" data-i18n="subtitle">Una cooperativa de tu ciudad los retira en el día y horario que coordinen.</p>
          <div class="hero__cta">
            <a href="/solicitar" class="btn btn--primary">
              <svg class="icon"><use href="/images/icons.svg#clipboard-list"/></svg>
              <span data-i18n="cta_request">Pedir recolección</span>
            </a>
            <a href="/rastrear" class="btn btn--outline">
              <svg class="icon"><use href="/images/icons.svg#magnifying-glass"/></svg>
              <span data-i18n="cta_track">Ver mi solicitud</span>
            </a>
          </div>
        </section>

        <section class="hero hero--dark">
          <h2 class="hero__title hero__title--sm" data-i18n="split_guest_title">Hacelo con tu nombre y celular</h2>
          <!-- El teléfono usa el componente canónico (prefix guestPhone) → los params
               llegan ya estructurados a /solicitar: guestCountryCode/guestPhoneNational/guestDdd -->
          <form action="/solicitar" method="get" class="stack">
            <div th:replace="~{fragments/forms :: text('nombre', 'nombre', 'text', null, null, 'split_guest_name', 'Tu nombre', true, null)}"></div>
            <div th:replace="~{fragments/forms :: phone('guestPhone', 'guestCountryCode', 'guestPhoneNational', 'guestDdd', null, null, true, null, null, null, null, null)}"></div>
            <div th:replace="~{fragments/forms :: submit('arrow-right', 'cta_request', 'Pedir recolección', 'btn--light')}"></div>
          </form>
        </section>
      </div>

      <!-- Contenedor escalable de cards educativas.
           Agregar una nueva card = 1 línea en landing-cards.html + 3 claves i18n.
           El grid se adapta automáticamente. -->
      <div class="page">
        <div th:replace="~{fragments/landing-cards :: section}"></div>
      </div>
    </div>
  </main>
</body>
</html>

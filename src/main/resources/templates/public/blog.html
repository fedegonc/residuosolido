<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Residuo Sólido — Blog</title>
</head>
<body>
  <main layout:fragment="content">
    <div class="page">
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="/">Inicio</a>
        <i class="fa-solid fa-chevron-right breadcrumb__sep"></i>
        <span>Blog</span>
      </nav>

      <div class="panel-header">
        <div>
          <h1 class="panel-header__title">Historias del reciclaje</h1>
          <p class="panel-header__subtitle">Conocé quiénes sostienen el reciclaje en la Frontera de la Paz</p>
        </div>
      </div>

      <article th:each="article, iter : ${articles}"
               th:id="${article.slug}"
               class="card card--blog">
        <div class="card__media">
          <img th:if="${article.image != null}"
               th:src="${article.image}"
               th:alt="${article.alt}"
               loading="lazy"
               class="card__img"
               width="800" />
          <div th:if="${article.image != null}" class="card__media-fallback" th:text="${article.tag}"></div>
          <span class="blog-card__tag blog-card__tag--overlay" th:text="${article.tag}">Tag</span>
        </div>
        <div class="card__header">
          <div class="card__icon"><i th:class="${article.icon}"></i></div>
          <div>
            <h2 class="card__title" th:text="${article.title}">Título</h2>
          </div>
        </div>
        <div class="card__content" th:utext="${article.content}">
          Contenido del artículo.
        </div>
      </article>

      <p class="blog-attribution">Fotografías: elaboración propia.</p>

      <a href="/" class="btn btn--outline btn--lg mt-2">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Volver al inicio</span>
      </a>
    </div>
  </main>
</body>
</html>

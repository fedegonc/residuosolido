<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Residuo Sólido — Blog</title>
</head>
<body>
  <main layout:fragment="content">
    <div class="page">
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="/">Inicio</a>
        <i class="fa-solid fa-chevron-right breadcrumb__sep"></i>
        <span>Blog</span>
      </nav>

      <div class="panel-header">
        <div>
          <h1 class="panel-header__title">Historias del reciclaje</h1>
          <p class="panel-header__subtitle">Conocé quiénes sostienen el reciclaje en la Frontera de la Paz</p>
        </div>
      </div>

      <article th:each="article, iter : ${articles}"
               th:id="${article.slug}"
               class="blog-article">
        <div class="blog-article__header">
          <div class="blog-article__icon"><i th:class="${article.icon}"></i></div>
          <div>
            <div class="blog-article__meta">
              <span class="blog-card__tag" th:text="${article.tag}">Tag</span>
              <span class="blog-card__date" th:text="${article.date}">Fecha</span>
            </div>
            <h2 class="blog-article__title" th:text="${article.title}">Título</h2>
          </div>
        </div>
        <div class="blog-article__content" th:utext="${article.content}">
          Contenido del artículo.
        </div>
      </article>

      <a href="/" class="btn btn--outline btn--lg mt-2">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Volver al inicio</span>
      </a>
    </div>
  </main>
</body>
</html>

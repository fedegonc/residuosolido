<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Rastrear solicitud</title></head>
<body>
  <main layout:fragment="content">
    <div class="page">

      <div class="card page--narrow mb">
        <h1 class="card__title" data-i18n="track_title">Buscar mi solicitud</h1>
        <p class="card__subtitle" data-i18n="track_subtitle">Si pediste recolección sin cuenta, ingresá tu teléfono y el código que te dimos.</p>
        <!-- El teléfono usa el componente canónico (prefix trackPhone) con names=null:
             los inputs son solo UI. app.js asigna name='telefono' al nacional y al
             submit lo reescribe como E.164 — el server sigue recibiendo `telefono`. -->
        <form th:action="@{/rastrear}" method="get" class="stack" id="trackForm">
          <div th:replace="~{fragments/forms :: phone('trackPhone', null, null, null, 'track_phone_label', 'Teléfono', true, ${telefono}, null, null, null, null)}"></div>
          <!-- queda inline: único campo con autocomplete="off" (forms::text no lo modela) -->
          <div class="field">
            <label for="codigo" data-i18n="track_code_label">Código de rastreo</label>
            <input type="text" id="codigo" name="codigo" class="input" th:value="${codigo}"
                   data-i18n-attr="placeholder:track_code_placeholder" placeholder="Ej: AB12CD34" autocomplete="off" required>
          </div>
          <div th:replace="~{fragments/forms :: submit('magnifying-glass', 'track_search_btn', 'Buscar', 'btn--primary btn--block')}"></div>
        </form>
      </div>

      <div th:if="${searched}">
        <div th:if="${requests != null and requests.isEmpty()}">
          <div th:replace="~{fragments/ui :: state('magnifying-glass', 'track_no_results', 'No encontramos solicitudes con esos datos')}"></div>
          <div class="text-center mt">
            <a href="/solicitar" class="btn btn--primary">
              <svg class="icon"><use href="/images/icons.svg#plus"/></svg> <span data-i18n="track_empty_cta">Crear una solicitud</span>
            </a>
          </div>
        </div>

        <div th:if="${requests != null and !requests.isEmpty()}">
          <h2 class="card__subtitle mb" data-i18n="track_results_title">Estas son tus solicitudes</h2>
          <div class="request-list">
            <div th:each="req : ${requests}" class="request-item">
              <div class="request-item__header">
                <span><span data-i18n="track_request_id">Solicitud</span> #<span th:text="${req.id}"></span></span>
                <div th:replace="~{fragments/ui :: status(${req.status})}"></div>
              </div>
              <div th:if="${req.createdAt != null}" class="info-row">
                <svg class="icon"><use href="/images/icons.svg#calendar"/></svg>
                <span th:text="${#temporals.format(req.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
              </div>
              <div th:if="${req.city != null}" class="info-row">
                <svg class="icon"><use href="/images/icons.svg#location-dot"/></svg>
                <span th:attr="data-i18n=${'city_' + #strings.toLowerCase(req.city.name())}" th:text="${req.city}"></span>
              </div>
              <div th:if="${req.address != null and !req.address.isBlank()}" class="info-row">
                <svg class="icon"><use href="/images/icons.svg#route"/></svg>
                <span th:text="${req.address}"></span>
              </div>
              <div th:if="${req.hasMaterials()}" class="request-item__materials">
                <span th:each="mat : ${req.materials}" class="tag" th:text="${mat.name()}"></span>
              </div>
              <div th:if="${req.organization != null}" class="info-row">
                <svg class="icon"><use href="/images/icons.svg#building"/></svg>
                <span th:text="${req.organization.displayName}"></span>
              </div>
              <div th:if="${req.organization == null}" class="info-row">
                <svg class="icon"><use href="/images/icons.svg#building"/></svg>
                <span data-i18n="track_no_org">Sin asignar</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</body>
</html>

<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/app-layout}">
<head>
    <title th:text="#{track.title}">Rastrear solicitud</title>
</head>
<body>
<main layout:fragment="content">
    <div class="page page--narrow page--padded">

        <div class="page-header">
            <h1 class="page-header__title" th:text="#{track.title}">Rastrear solicitud</h1>
            <p class="page-header__subtitle" th:text="#{track.subtitle}">Ingresá tu teléfono para ver tus solicitudes</p>
        </div>

        <div class="card mb-6">
            <div class="card__body">
                <form th:action="@{/rastrear}" method="post" class="flex flex-col gap-3">
                    <div class="flex flex-wrap gap-3">
                        <input type="tel" name="phone" th:value="${phone}"
                               th:placeholder="#{track.phone_placeholder}"
                               class="form__input flex-1" required />
                        <button type="submit" class="btn btn--green">
                            <i aria-hidden="true" class="fa-solid fa-magnifying-glass"></i><span th:text="#{track.search}">Buscar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div th:if="${searched}">
            <div th:if="${requests.isEmpty()}" class="empty-state">
                <i aria-hidden="true" class="fa-solid fa-box-open empty-state__icon"></i>
                <p th:text="#{track.no_results}">No se encontraron solicitudes con ese teléfono</p>
            </div>

            <div th:if="${!requests.isEmpty()}">
                <h2 class="text-lg font-semibold text-gray-900 mb-2">
                    <span th:text="#{track.results}">Solicitudes encontradas</span>:
                    <span class="icon-green-dark" th:text="${requests.size()}"></span>
                </h2>

                <div th:each="req : ${requests}" class="card mb-2">
                    <div class="card__body flex flex-between items-start gap-3">
                        <div class="flex-1">
                            <span class="text-xs text-gray-500" th:text="#{track.request_id} + ': ' + ${req.id}">ID</span>
                            <p class="text-sm text-gray-700 mt-1">
                                <i aria-hidden="true" class="fa-solid fa-location-dot text-gray-400"></i>
                                <span th:text="${req.address}"></span>,
                                <span th:text="${req.city != null ? req.city.name() : ''}"></span>
                            </p>
                            <p class="text-sm text-gray-600 mt-1">
                                <i aria-hidden="true" class="fa-solid fa-calendar text-gray-400"></i>
                                <span th:text="${#temporals.format(req.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                            </p>
                            <div th:if="${req.hasMaterials()}" class="flex flex-wrap gap-1 mt-1">
                                <span th:each="mat : ${req.materials}" class="badge"
                                      th:text="${#messages.msgOrNull('material.' + mat.name().toLowerCase()) ?: mat.name()}">Material</span>
                            </div>
                            <div th:if="${req.confirmedSlot != null}" class="text-sm text-gray-600 mt-1">
                                <i aria-hidden="true" class="fa-solid fa-clock text-gray-400"></i>
                                <span th:text="#{track.confirmed_slot} + ': '"></span>
                                <span class="font-medium" th:text="${#messages.msgOrNull('timeslot.' + req.confirmedSlot.name().toLowerCase()) ?: req.confirmedSlot.name()}"></span>
                            </div>
                        </div>
                        <span class="badge" th:classappend="${req.isPending()} ? ' badge--warning' : (${req.isInProgress()} ? ' badge--info' : (${req.isCompleted()} ? ' badge--success' : ' badge--error'))"
                              th:text="${#messages.msgOrNull('request.status.' + req.status.name().toLowerCase()) ?: req.status.name()}">Status</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center pt-6">
            <a th:href="@{/}" class="btn btn--ghost btn--sm">
                <i aria-hidden="true" class="fa-solid fa-arrow-left"></i><span th:text="#{track.back_home}">Volver al inicio</span>
            </a>
        </div>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{track.title}">Rastrear solicitud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900" th:text="#{track.title}">Rastrear solicitud</h1>
            <p class="text-sm text-gray-600 mt-1" th:text="#{track.subtitle}">Ingresá tu teléfono para ver tus solicitudes</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <form th:action="@{/rastrear}" method="post" class="flex flex-col sm:flex-row gap-3">
                <input type="tel" name="phone" th:value="${phone}" 
                       th:placeholder="#{track.phone_placeholder}"
                       class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
                       required />
                <button type="submit" 
                        class="px-6 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 flex items-center justify-center gap-2">
                    <i data-lucide="search" class="w-4 h-4"></i>
                    <span th:text="#{track.search}">Buscar</span>
                </button>
            </form>
        </div>

        <div th:if="${searched}" class="space-y-4">
            <div th:if="${requests.isEmpty()}" class="bg-white rounded-lg shadow p-8 text-center">
                <i data-lucide="package-x" class="w-12 h-12 text-gray-400 mx-auto mb-3"></i>
                <p class="text-gray-600" th:text="#{track.no_results}">No se encontraron solicitudes con ese teléfono</p>
            </div>

            <div th:if="${!requests.isEmpty()}" class="space-y-3">
                <h2 class="text-lg font-semibold text-gray-900 mb-2">
                    <span th:text="#{track.results}">Solicitudes encontradas</span>:
                    <span class="text-emerald-600" th:text="${requests.size()}"></span>
                </h2>

                <div th:each="req : ${requests}" class="bg-white rounded-lg shadow p-5">
                    <div class="flex items-start justify-between mb-3">
                        <div>
                            <span class="text-xs text-gray-500" th:text="#{track.request_id} + ': ' + ${req.id}">ID</span>
                            <p class="text-sm text-gray-700 mt-1">
                                <i data-lucide="map-pin" class="w-4 h-4 inline text-gray-400"></i>
                                <span th:text="${req.address}"></span>,
                                <span th:text="${req.city != null ? req.city.name() : ''}"></span>
                            </p>
                            <p class="text-sm text-gray-600 mt-1">
                                <i data-lucide="calendar" class="w-4 h-4 inline text-gray-400"></i>
                                <span th:text="${#temporals.format(req.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                            </p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-semibold"
                              th:classappend="${req.isPending()} ? 'bg-amber-100 text-amber-800' : (${req.isInProgress()} ? 'bg-blue-100 text-blue-800' : (${req.isCompleted()} ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'))"
                              th:text="${#messages.msgOrNull('request.status.' + req.status.name().toLowerCase()) ?: req.status.name()}">
                        </span>
                    </div>

                    <div th:if="${req.hasMaterials()}" class="flex flex-wrap gap-1.5 mt-2">
                        <span th:each="mat : ${req.materials}" 
                              class="px-2 py-0.5 bg-gray-100 text-gray-700 rounded text-xs"
                              th:text="${#messages.msgOrNull('material.' + mat.name().toLowerCase()) ?: mat.name()}">
                        </span>
                    </div>

                    <div th:if="${req.confirmedSlot != null}" class="mt-3 text-sm text-gray-600">
                        <i data-lucide="clock" class="w-4 h-4 inline text-gray-400"></i>
                        <span th:text="#{track.confirmed_slot} + ': '"></span>
                        <span class="font-medium" th:text="${#messages.msgOrNull('timeslot.' + req.confirmedSlot.name().toLowerCase()) ?: req.confirmedSlot.name()}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-8 text-center">
            <a th:href="@{/}" class="text-sm text-gray-500 hover:text-gray-700 inline-flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span th:text="#{track.back_home}">Volver al inicio</span>
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>

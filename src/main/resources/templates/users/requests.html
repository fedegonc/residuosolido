<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Mis solicitudes</title></head>
<body>
  <main layout:fragment="content">
    <div class="page">
      <nav class="breadcrumb">
        <a href="/">Inicio</a>
        <svg class="icon breadcrumb__sep"><use href="/images/icons.svg#chevron-right"/></svg>
        <span data-i18n="req_list_title">Mis solicitudes</span>
      </nav>

      <div class="row row--between mb-lg">
        <div th:replace="~{fragments/ui :: greeting('dash_welcome', 'Hola', ${user.displayName}, false, 'dash_subtitle', 'Acá ves tus solicitudes de recolección y su estado.')}"></div>
        <a href="/solicitar" class="btn btn--primary">
          <svg class="icon"><use href="/images/icons.svg#plus"/></svg>
          <span data-i18n="req_list_new">Nueva solicitud</span>
        </a>
      </div>

      <div class="grid grid--4 mb-lg" th:if="${requestStats != null and requestStats.get('total') > 0}">
        <div th:replace="~{fragments/ui :: tile('list', ${requestStats.get('total')}, 'dash_stat_total', 'Total')}"></div>
        <div th:replace="~{fragments/ui :: tile('clock', ${requestStats.get('pending')}, 'dash_stat_pending', 'Pendientes')}"></div>
        <div th:replace="~{fragments/ui :: tile('truck', ${requestStats.get('inProgress')}, 'dash_stat_progress', 'En curso')}"></div>
        <div th:replace="~{fragments/ui :: tile('circle-check', ${requestStats.get('completed')}, 'dash_stat_completed', 'Completadas')}"></div>
      </div>

      <div th:if="${requests != null and !requests.isEmpty()}" class="kanban-board">
        <th:block th:replace="~{fragments/kanban :: kanban-column(status='PENDING', requests=${requestsByStatus.get('PENDING')}, basePath='/solicitudes', isUserView=true, titleKey='dash_stat_pending', title='Pendientes', count=${pendingCount})}"></th:block>
        <th:block th:replace="~{fragments/kanban :: kanban-column(status='IN_PROGRESS', requests=${requestsByStatus.get('IN_PROGRESS')}, basePath='/solicitudes', isUserView=true, titleKey='dash_stat_progress', title='En curso', count=${inProgressCount})}"></th:block>
        <th:block th:replace="~{fragments/kanban :: kanban-column(status='COMPLETED', requests=${requestsByStatus.get('COMPLETED')}, basePath='/solicitudes', isUserView=true, titleKey='dash_stat_completed', title='Completadas', count=${completedCount})}"></th:block>
        <th:block th:replace="~{fragments/kanban :: kanban-column(status='REJECTED', requests=${requestsByStatus.get('REJECTED')}, basePath='/solicitudes', isUserView=true, titleKey='dash_stat_rejected', title='Rechazadas', count=${rejectedCount})}"></th:block>
      </div>

      <div th:if="${requests == null or requests.isEmpty()}">
        <div th:replace="~{fragments/ui :: state('seedling', 'user_requests_empty', 'Acá van a aparecer tus solicitudes')}"></div>
        <div class="text-center mt">
          <a href="/solicitar" class="btn btn--primary">
            <svg class="icon"><use href="/images/icons.svg#plus"/></svg> <span data-i18n="req_list_new">Nueva solicitud</span>
          </a>
        </div>
      </div>

      <div th:replace="~{fragments/ui :: educationalLinks(cards=${cards})}"></div>
    </div>
  </main>
</body>
</html>

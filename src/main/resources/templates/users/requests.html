<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Residuo Sólido — Solicitudes</title>
</head>
<body>
  <main layout:fragment="content">
    <div class="page panel-section">

      <!-- Breadcrumbs -->
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="/" class="breadcrumb__link">Inicio</a>
        <i class="fa-solid fa-chevron-right breadcrumb__sep"></i>
        <a href="/usuarios/inicio" class="breadcrumb__link">Mi panel</a>
        <i class="fa-solid fa-chevron-right breadcrumb__sep"></i>
        <span data-i18n="req_list_title">Mis solicitudes</span>
      </nav>

      <!-- Header -->
      <div class="panel-header">
        <h1 class="panel-header__title" data-i18n="req_list_title">Mis solicitudes</h1>
        <a href="/solicitudes/nueva" class="btn btn--primary">
          <i class="fa-solid fa-plus"></i>
          <span data-i18n="req_list_new">Nueva solicitud</span>
        </a>
      </div>

      <!-- Request list -->
      <div th:if="${requests != null and !requests.isEmpty()}">
        <div class="request-list">
          <div th:each="req : ${requests}" class="request-item">
            <div class="request-item__header">
              <span class="request-item__id">
                <span data-i18n="track_request_id">Solicitud</span>
                #<span th:text="${req.id}"></span>
              </span>
              <span class="status-badge"
                    th:classappend="${req.status.name() == 'PENDING'} ? 'status-badge--pending' :
                                     (${req.status.name() == 'IN_PROGRESS'} ? 'status-badge--in_progress' :
                                     (${req.status.name() == 'COMPLETED'} ? 'status-badge--completed' :
                                     'status-badge--rejected'))"
                    th:text="${req.status.name() == 'PENDING'} ? 'Pendiente' :
                             (${req.status.name() == 'IN_PROGRESS'} ? 'En curso' :
                             (${req.status.name() == 'COMPLETED'} ? 'Completado' : 'Rechazado'))">
                Pendiente
              </span>
            </div>
            <div class="request-item__body">
              <div class="request-item__row" th:if="${req.createdAt != null}">
                <i class="fa-solid fa-calendar"></i>
                <span th:text="${#temporals.format(req.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
              </div>
              <div class="request-item__row" th:if="${req.city != null}">
                <i class="fa-solid fa-location-dot"></i>
                <span th:text="${req.city}"></span>
              </div>
              <div class="request-item__row" th:if="${req.address != null and !req.address.isBlank()}">
                <i class="fa-solid fa-route"></i>
                <span th:text="${req.address}"></span>
              </div>
              <div th:if="${req.hasMaterials()}" class="request-item__materials">
                <span th:each="mat : ${req.materials}" class="material-tag" th:text="${mat.name()}"></span>
              </div>
              <div class="request-item__row" th:if="${req.organization != null}">
                <i class="fa-solid fa-building"></i>
                <span th:text="${req.organization.displayName}"></span>
              </div>
              <div class="request-item__row" th:if="${req.organization == null}">
                <i class="fa-solid fa-building"></i>
                <span data-i18n="track_no_org">Sin asignar</span>
              </div>
            </div>
            <!-- Actions -->
            <div class="form-actions">
              <a th:href="@{/solicitud/{id}(id=${req.id})}" class="btn btn--outline btn--sm">
                <i class="fa-solid fa-eye"></i>
                <span data-i18n="req_list_view">Ver</span>
              </a>
              <a th:if="${req.canBeEdited()}"
                 th:href="@{/solicitud/{id}/editar(id=${req.id})}" class="btn btn--outline btn--sm">
                <i class="fa-solid fa-pen"></i>
                <span data-i18n="req_list_edit">Editar</span>
              </a>
              <form th:if="${req.canBeDeleted()}"
                    th:action="@{/solicitud/{id}/eliminar(id=${req.id})}" method="post"
                    onsubmit="return confirm('¿Eliminar esta solicitud?');"
                    style="display:inline;">
                <button type="submit" class="btn btn--outline btn--sm" style="color:#b91c1c;border-color:#fecaca;">
                  <i class="fa-solid fa-trash"></i>
                  <span data-i18n="req_list_delete">Eliminar</span>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty state -->
      <div th:if="${requests == null or requests.isEmpty()}" class="info-card">
        <div class="track-empty">
          <div class="track-empty__illustration">
            <i class="fa-solid fa-clipboard-list"></i>
          </div>
          <h2 class="track-empty__title" data-i18n="req_list_empty">No tenés solicitudes todavía</h2>
          <p class="track-empty__text" data-i18n="req_list_empty_desc">Creá tu primera solicitud de recolección</p>
          <a href="/solicitudes/nueva" class="btn btn--primary btn--lg" style="margin-top:.75rem;">
            <i class="fa-solid fa-plus"></i>
            <span data-i18n="req_list_new">Nueva solicitud</span>
          </a>
        </div>
      </div>

    </div>
  </main>
</body>
</html>

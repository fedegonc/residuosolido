<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Residuo Sólido — Perfil</title>
</head>
<body>
  <main layout:fragment="content">
    <div class="page panel-section">

      <!-- Breadcrumbs -->
      <nav class="breadcrumb" aria-label="breadcrumb">
        <th:block th:each="crumb, iter : ${breadcrumbs}">
          <a th:if="${crumb.href != ''}" th:href="${crumb.href}" th:text="${crumb.label}">Inicio</a>
          <span th:unless="${crumb.href != ''}" th:text="${crumb.label}">Mi perfil</span>
          <i th:if="${!iter.last}" class="fa-solid fa-chevron-right breadcrumb__sep"></i>
        </th:block>
      </nav>

      <!-- Header -->
      <div class="panel-header">
        <h1 class="panel-header__title" data-i18n="profile_title">Mi perfil</h1>
        <button type="button" class="btn btn--outline" id="editToggle">
          <i class="fa-solid fa-pen"></i>
          <span data-i18n="profile_edit">Editar perfil</span>
        </button>
      </div>

      <div class="form-grid--2" style="grid-template-columns:1fr;gap:1rem;">

        <!-- Info card (view mode) -->
        <div class="info-card" id="viewCard">
          <h2 class="info-card__title" data-i18n="profile_info">Información personal</h2>
          <div class="info-row">
            <i class="fa-solid fa-user"></i>
            <span class="info-row__label" data-i18n="profile_username">Usuario</span>
            <span class="info-row__value" th:text="${user.username}"></span>
          </div>
          <div class="info-row">
            <i class="fa-solid fa-id-card"></i>
            <span class="info-row__label" data-i18n="profile_name">Nombre</span>
            <span class="info-row__value" th:if="${user.firstName != null and !user.firstName.isBlank()}" th:text="${user.firstName}"></span>
            <span class="info-row__empty" th:unless="${user.firstName != null and !user.firstName.isBlank()}" data-i18n="profile_no_phone">Sin teléfono</span>
          </div>
          <div class="info-row">
            <i class="fa-solid fa-envelope"></i>
            <span class="info-row__label" data-i18n="profile_email">Email</span>
            <span class="info-row__value" th:text="${user.email}"></span>
          </div>
          <div class="info-row">
            <i class="fa-solid fa-phone"></i>
            <span class="info-row__label" data-i18n="profile_phone">Teléfono</span>
            <span class="info-row__value" th:if="${user.hasPhone()}" th:text="${user.phone}"></span>
            <span class="info-row__empty" th:unless="${user.hasPhone()}" data-i18n="profile_no_phone">Sin teléfono</span>
          </div>
          <div class="info-row">
            <i class="fa-solid fa-location-dot"></i>
            <span class="info-row__label" data-i18n="profile_city">Ciudad</span>
            <span class="info-row__value" th:if="${user.hasCity()}" th:attr="data-i18n=${'city_' + #strings.toLowerCase(user.city.name())}" th:text="${user.city}"></span>
            <span class="info-row__empty" th:unless="${user.hasCity()}" data-i18n="profile_no_city">Sin ciudad</span>
          </div>
        </div>

        <!-- Edit card (hidden by default) -->
        <div class="info-card is-hidden" id="editCard">
          <h2 class="info-card__title" data-i18n="profile_edit_title">Editar datos</h2>
          <form th:action="@{/usuarios/perfil}" method="post" class="auth-form">
            <div class="form-group">
              <label for="firstName" data-i18n="profile_name_label">Nombre</label>
              <input type="text" id="firstName" name="firstName" class="form-input" th:value="${user.firstName}">
            </div>
            <div class="form-group">
              <label for="email" data-i18n="profile_email_label">Email</label>
              <input type="email" id="email" name="email" class="form-input" th:value="${user.email}" required>
            </div>
            <div class="form-group">
              <label for="phone" data-i18n="profile_phone_label">Teléfono</label>
              <input type="tel" id="phone" name="phone" class="form-input" th:value="${user.phone}">
            </div>
            <div class="form-group">
              <label for="city" data-i18n="profile_city_label">Ciudad</label>
              <select id="city" name="city" class="form-select">
                <option value="" data-i18n="profile_city_select">Seleccioná una ciudad</option>
                <option th:each="c : ${cities}" th:value="${c}"
                        th:attr="data-i18n=${'city_' + #strings.toLowerCase(c.name())}"
                        th:text="${c.name()}"
                        th:selected="${user.city != null and user.city == c}"></option>
              </select>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn--primary">
                <i class="fa-solid fa-check"></i>
                <span data-i18n="profile_save">Guardar</span>
              </button>
              <button type="button" class="btn btn--outline" id="cancelEdit">
                <i class="fa-solid fa-xmark"></i>
                <span data-i18n="profile_cancel">Cancelar</span>
              </button>
            </div>
          </form>
        </div>

        <!-- Stats card -->
        <div class="info-card">
          <h2 class="info-card__title" data-i18n="profile_stats">Estadísticas de solicitudes</h2>
          <div class="stats-grid" style="grid-template-columns:repeat(2,1fr);">
            <div class="stat-card">
              <div class="stat-card__icon stat-card__icon--total">
                <i class="fa-solid fa-list"></i>
              </div>
              <span class="stat-card__value" th:text="${requestStats.get('total')}">0</span>
              <span class="stat-card__label" data-i18n="dash_stat_total">Total</span>
            </div>
            <div class="stat-card">
              <div class="stat-card__icon stat-card__icon--pending">
                <i class="fa-solid fa-clock"></i>
              </div>
              <span class="stat-card__value" th:text="${requestStats.get('pending')}">0</span>
              <span class="stat-card__label" data-i18n="dash_stat_pending">Pendientes</span>
            </div>
            <div class="stat-card">
              <div class="stat-card__icon stat-card__icon--progress">
                <i class="fa-solid fa-truck"></i>
              </div>
              <span class="stat-card__value" th:text="${requestStats.get('inProgress')}">0</span>
              <span class="stat-card__label" data-i18n="dash_stat_progress">En curso</span>
            </div>
            <div class="stat-card">
              <div class="stat-card__icon stat-card__icon--completed">
                <i class="fa-solid fa-circle-check"></i>
              </div>
              <span class="stat-card__value" th:text="${requestStats.get('completed')}">0</span>
              <span class="stat-card__label" data-i18n="dash_stat_completed">Completadas</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <script>
    (function () {
      var editToggle = document.getElementById('editToggle');
      var viewCard = document.getElementById('viewCard');
      var editCard = document.getElementById('editCard');
      var cancelEdit = document.getElementById('cancelEdit');

      if (editToggle && viewCard && editCard) {
        editToggle.addEventListener('click', function () {
          viewCard.classList.add('is-hidden');
          editCard.classList.remove('is-hidden');
        });
      }
      if (cancelEdit && viewCard && editCard) {
        cancelEdit.addEventListener('click', function () {
          editCard.classList.add('is-hidden');
          viewCard.classList.remove('is-hidden');
        });
      }
    })();
    </script>
  </main>
</body>
</html>

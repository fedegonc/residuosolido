<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Residuo Sólido — Solicitud</title>
</head>
<body>
  <main layout:fragment="content">
    <div class="page form-section">
      <div class="form-card">

        <h1 class="form-card__title" th:if="${isEdit}" data-i18n="req_form_title_edit">Editar solicitud</h1>
        <h1 class="form-card__title" th:unless="${isEdit}" data-i18n="req_form_title_new">Solicitar recolección</h1>
        <p class="form-card__subtitle" th:if="${isEdit}" data-i18n="req_form_subtitle_edit">Modificá los datos de tu solicitud</p>
        <p class="form-card__subtitle" th:unless="${isEdit}" data-i18n="req_form_subtitle_new">Contanos qué tenés y nos encargamos del resto</p>

        <form th:action="${isEdit} ? '/solicitud/' + ${request.id} + '/editar' : '/solicitudes'"
              method="post"
              enctype="multipart/form-data"
              id="requestForm"
              class="req-form">

          <!-- Guest fields (only for anonymous users) -->
          <div th:if="${isGuest}" class="req-form__row">
            <div class="form-group">
              <label for="guestName" data-i18n="req_form_guest_name">Tu nombre <span class="req">*</span></label>
              <input type="text" id="guestName" name="guestName" class="form-input"
                     th:value="${request.guestName}"
                     data-i18n-attr="placeholder:req_form_guest_name_placeholder"
                     placeholder="Ej: Ana García" required>
            </div>
            <div class="form-group">
              <label for="guestPhone" data-i18n="req_form_guest_phone">Tu teléfono <span class="req">*</span></label>
              <input type="tel" id="guestPhone" name="guestPhone" class="form-input"
                     th:value="${request.guestPhone}"
                     data-i18n-attr="placeholder:req_form_guest_phone_placeholder"
                     placeholder="Ej: +598 99 123 456"
                     pattern="^[+][0-9]{1,3}[\s0-9]{6,15}$"
                     maxlength="20"
                     required>
            </div>
          </div>
          <p th:if="${isGuest}" class="form-hint" data-i18n="req_form_guest_hint">Te pedimos estos datos para poder rastrear tu solicitud</p>
          <p th:if="${isGuest}" class="form-hint">
            <a href="/auth/login" data-i18n="req_form_have_account">¿Ya tenés cuenta? Iniciá sesión</a>
          </p>

          <!-- Logged-in note (instead of silently hiding guest fields) -->
          <div th:if="${!isGuest}" class="form-info-note">
            <i class="fa-solid fa-circle-info"></i>
            <span data-i18n="req_form_logged_in_note">Usaremos los datos de tu perfil para esta solicitud</span>
          </div>

          <!-- City + Organization -->
          <div class="req-form__row">
            <div class="form-group">
              <label for="city" data-i18n="req_form_city">Ciudad <span class="req">*</span></label>
              <select id="city" name="city" class="form-select" th:disabled="${isEdit}" required>
                <option value="" data-i18n="req_form_city_select">Seleccioná una ciudad</option>
                <option th:each="c : ${cities}"
                        th:value="${c}"
                        th:attr="data-i18n=${'req_city_' + #strings.toLowerCase(c.name())}"
                        th:text="${c.name()}"
                        th:selected="${selectedCity != null and selectedCity == c}"></option>
              </select>
            </div>
            <div class="form-group">
              <label for="organizationId" data-i18n="req_form_org">Organización de acopio <span class="req">*</span></label>
              <select id="organizationId" name="organizationId" class="form-select" required disabled>
                <option value="" data-i18n="req_form_org_select">Primero seleccioná una ciudad</option>
                <th:block th:if="${isEdit and organizations != null}">
                  <option th:each="org : ${organizations}"
                          th:value="${org.id}"
                          th:attr="data-materials=${org.acceptedMaterialsCsv}"
                          th:text="${org.displayName}"
                          th:selected="${request.organization != null and request.organization.id == org.id}"></option>
                </th:block>
              </select>
            </div>
          </div>

          <!-- Address (reference only on edit) -->
          <div class="req-form__row">
            <div class="form-group">
              <label for="address" data-i18n="req_form_address">Dirección de recolección <span class="req">*</span></label>
              <input type="text" id="address" name="address" class="form-input"
                     th:value="${request.address}"
                     data-i18n-attr="placeholder:req_form_address_placeholder"
                     placeholder="Ej: Calle 123" required>
            </div>
            <div th:if="${isEdit}" class="form-group">
              <label for="addressReference" data-i18n="req_form_address_ref">Referencia (opcional)</label>
              <input type="text" id="addressReference" name="addressReference" class="form-input"
                     th:value="${request.addressReference}"
                     data-i18n-attr="placeholder:req_form_address_ref_placeholder"
                     placeholder="Ej: Casa esquinera, portón verde">
            </div>
          </div>

          <!-- Materials (always shown) -->
          <div class="req-form__row req-form__row--wide">
            <div class="form-group">
              <label data-i18n="req_form_materials">Materiales a reciclar <span class="req">*</span></label>
              <div class="check-grid">
                <th:block th:each="mat : ${materials}">
                  <label class="check-card" th:attr="data-material=${mat.name()}">
                    <input type="checkbox" name="materials" th:value="${mat.name()}"
                           th:checked="${request.hasMaterials() and request.materials.contains(mat)}">
                    <span th:attr="data-i18n=${'req_mat_' + #strings.toLowerCase(mat.name())}" th:text="${mat.name()}">PLASTICO</span>
                  </label>
                </th:block>
              </div>
            </div>
          </div>

          <!-- Time slots (only on edit) -->
          <div th:if="${isEdit}" class="req-form__row req-form__row--wide">
            <div class="form-group">
              <label data-i18n="req_form_timeslot">Franja horaria</label>
              <div class="radio-grid">
                <th:block th:each="slot : ${timeSlots}">
                  <label class="radio-card">
                    <input type="radio" name="timeSlot" th:value="${slot.name()}"
                           th:checked="${request.confirmedSlot != null and request.confirmedSlot == slot}">
                    <i th:class="${slot.name() == 'MANANA'} ? 'fa-solid fa-sun' :
                                 (${slot.name() == 'TARDE'} ? 'fa-solid fa-cloud-sun' : 'fa-solid fa-moon')}"></i>
                    <span th:attr="data-i18n=${'req_form_slot_' + #strings.toLowerCase(slot.name())}" th:text="${slot.name()}">MANANA</span>
                  </label>
                </th:block>
              </div>
            </div>
          </div>

          <!-- Weight + volume (only on edit) -->
          <div th:if="${isEdit}" class="req-form__row">
            <div class="form-group">
              <label data-i18n="req_form_weight">Peso aproximado (opcional)</label>
              <select id="estimatedWeight" name="estimatedWeight" class="form-select">
                <option value="" data-i18n="req_form_select_default">— Sin especificar —</option>
                <option value="0-5" th:selected="${request.estimatedWeight == '0-5'}" data-i18n="req_form_weight_0_5">Menos de 5 kg</option>
                <option value="5-20" th:selected="${request.estimatedWeight == '5-20'}" data-i18n="req_form_weight_5_20">5 a 20 kg</option>
                <option value="20-50" th:selected="${request.estimatedWeight == '20-50'}" data-i18n="req_form_weight_20_50">20 a 50 kg</option>
                <option value="50+" th:selected="${request.estimatedWeight == '50+'}" data-i18n="req_form_weight_50_plus">Más de 50 kg</option>
              </select>
            </div>
            <div class="form-group">
              <label data-i18n="req_form_volume">Volumen aproximado (opcional)</label>
              <select id="estimatedVolume" name="estimatedVolume" class="form-select">
                <option value="" data-i18n="req_form_select_default">— Sin especificar —</option>
                <option value="bag" th:selected="${request.estimatedVolume == 'bag'}" data-i18n="req_form_volume_bag">Una bolsa</option>
                <option value="box" th:selected="${request.estimatedVolume == 'box'}" data-i18n="req_form_volume_box">Una caja</option>
                <option value="trunk" th:selected="${request.estimatedVolume == 'trunk'}" data-i18n="req_form_volume_trunk">Un baúl de auto</option>
                <option value="pickup" th:selected="${request.estimatedVolume == 'pickup'}" data-i18n="req_form_volume_pickup">Carga de camioneta</option>
              </select>
            </div>
          </div>

          <!-- Image upload (only on edit) -->
          <div th:if="${isEdit}" class="req-form__row req-form__row--wide">
            <div class="form-group">
              <label data-i18n="req_form_image">Foto (opcional)</label>
              <label class="file-upload" for="imageFile">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span data-i18n="req_form_image_choose">Click para subir</span>
                <input type="file" id="imageFile" name="imageFile" accept="image/jpeg,image/png">
                <span class="file-name" id="fileName"></span>
              </label>
            </div>
            <div th:if="${request.hasImage()}" class="form-group">
              <label>Imagen actual</label>
              <img th:src="${request.imageUrl}" alt="Imagen actual" style="max-height:80px;border-radius:var(--radius);border:1px solid var(--border);">
            </div>
          </div>

          <!-- Actions -->
          <div class="form-actions">
            <button type="submit" class="btn btn--primary">
              <i class="fa-solid fa-paper-plane"></i>
              <span th:if="${isEdit}" data-i18n="req_form_submit_edit">Guardar cambios</span>
              <span th:unless="${isEdit}" data-i18n="req_form_submit_new">Enviar solicitud</span>
            </button>
            <a th:href="${isEdit} ? '/solicitud/' + ${request.id} : '/'" class="btn btn--outline">
              <i class="fa-solid fa-xmark"></i>
              <span data-i18n="req_form_cancel">Cancelar</span>
            </a>
          </div>

        </form>
      </div>
    </div>

    <!-- Page-specific JS -->
    <script th:inline="javascript">
    (function () {
      'use strict';

      var citySelect = document.getElementById('city');
      var orgSelect = document.getElementById('organizationId');
      var isEdit = /*[[${isEdit}]]*/ false;

      // Load organizations dynamically when city changes
      if (citySelect && orgSelect) {
        // Enable org select when city is selected
        citySelect.addEventListener('change', function () {
          var city = citySelect.value;
          if (!city) {
            orgSelect.disabled = true;
            orgSelect.innerHTML = '<option value="" data-i18n="req_form_org_select">Primero seleccioná una ciudad</option>';
            return;
          }
          orgSelect.disabled = false;
          orgSelect.innerHTML = '<option value="" data-i18n="req_form_org_loading">Cargando organizaciones...</option>';
          fetch('/api/organizations/by-city?city=' + city)
            .then(function (r) { return r.json(); })
            .then(function (orgs) {
              if (!orgs || orgs.length === 0) {
                orgSelect.innerHTML = '<option value="" data-i18n="req_form_org_none">No hay organizaciones en esta ciudad</option>';
              } else {
                var html = '';
                orgs.forEach(function (org) {
                  var mats = org.acceptedMaterials || [];
                  var matLabels = mats.length > 0 ? ' (' + mats.join(', ') + ')' : '';
                  html += '<option value="' + org.id + '" data-materials="' + mats.join(',') + '">' +
                          (org.displayName || org.name || 'Organización') + matLabels + '</option>';
                });
                orgSelect.innerHTML = html;
              }
              filterMaterialsByOrg();
            })
            .catch(function () {
              orgSelect.innerHTML = '<option value="" data-i18n="req_form_org_none">No hay organizaciones en esta ciudad</option>';
              filterMaterialsByOrg();
            });
        });
      }

      // Dynamically show only the materials the selected organization accepts.
      // Purely a UX filter (no server-side duplicate validation is added for this).
      function filterMaterialsByOrg() {
        var selected = orgSelect ? orgSelect.options[orgSelect.selectedIndex] : null;
        var csv = selected ? selected.getAttribute('data-materials') : null;
        var allowed = csv ? csv.split(',').filter(Boolean) : null;
        document.querySelectorAll('.check-card').forEach(function (card) {
          var input = card.querySelector('input[type="checkbox"]');
          if (!input) return;
          var isAllowed = !allowed || allowed.length === 0 || allowed.indexOf(card.getAttribute('data-material')) !== -1;
          card.classList.toggle('is-hidden', !isAllowed);
          input.disabled = !isAllowed;
          if (!isAllowed && input.checked) {
            input.checked = false;
            card.classList.remove('check-card--checked');
          }
        });
      }
      if (orgSelect) {
        orgSelect.addEventListener('change', filterMaterialsByOrg);
        filterMaterialsByOrg();
      }

      // Radio card visual state
      document.querySelectorAll('.radio-card input[type="radio"]').forEach(function (rb) {
        rb.addEventListener('change', function () {
          document.querySelectorAll('.radio-card').forEach(function (card) {
            card.classList.remove('radio-card--checked');
          });
          rb.closest('.radio-card').classList.add('radio-card--checked');
        });
      });
      // Mark initially checked radio
      document.querySelectorAll('.radio-card input[type="radio"]:checked').forEach(function (rb) {
        rb.closest('.radio-card').classList.add('radio-card--checked');
      });

      // File upload name display
      var fileInput = document.getElementById('imageFile');
      var fileName = document.getElementById('fileName');
      if (fileInput && fileName) {
        fileInput.addEventListener('change', function () {
          if (fileInput.files && fileInput.files.length > 0) {
            fileName.textContent = fileInput.files[0].name;
          } else {
            fileName.textContent = '';
          }
        });
      }
    })();
    </script>
  </main>
</body>
</html>

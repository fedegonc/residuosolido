<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Solicitar recolección</title></head>
<body>
  <!--
    Flags que controlan este formulario (RequestCreateController):
      needsPhone = true  → usuario logueado SIN teléfono guardado. Muestra userPhone.
      isEdit     = true  → editando una solicitud existente. Habilita addressReference,
                   timeSlot e imageFile (NO disponibles al crear,
                   ver MEJORAS.md #103). Deshabilita city/organizationId.
    Combinaciones reales:
      needsPhone=true,  isEdit=false → alta logueado sin teléfono
      needsPhone=false, isEdit=false → alta logueado con teléfono
      (cualquier needsPhone), isEdit=true → edición (campos extra arriba)
  -->
  <main layout:fragment="content">
    <div class="page page--center">
      <div class="split">
        <section class="hero">
          <h1 class="card__title" th:if="${isEdit}" data-i18n="req_form_title_edit">Editar solicitud</h1>
          <h1 class="card__title" th:unless="${isEdit}" data-i18n="req_form_title_new">Solicitar recolección</h1>
          <p class="card__subtitle" th:if="${isEdit}" data-i18n="req_form_subtitle_edit">Modificá los datos de tu solicitud</p>
          <p class="card__subtitle" th:unless="${isEdit}" data-i18n="req_form_subtitle_new">Decinos qué materiales tenés y en qué dirección retirarlos.</p>

          <form th:action="${isEdit} ? '/solicitudes/' + ${request.id} : '/solicitar'"
                method="post" enctype="multipart/form-data" id="requestForm" class="stack">
            <input th:if="${isEdit}" type="hidden" name="_method" value="put">

            <!-- Sección: contacto -->
            <div class="form-section">
              <h2 class="card__subtitle" data-i18n="req_form_section_contact">Tu información de contacto</h2>
              <div class="alert alert--info">
                <svg class="icon"><use href="/images/icons.svg#circle-info"/></svg>
                <span data-i18n="req_form_logged_in_note">Usaremos los datos de tu perfil para esta solicitud</span>
              </div>
              <div th:if="${needsPhone}">
                <div th:replace="~{fragments/forms :: phone('userPhone', 'userCountryCode', 'userPhoneNational', 'userDdd', null, 'Teléfono de contacto', true, null, null, null, null, 'Se guardará en tu perfil para coordinar la recolección.')}"></div>
              </div>
            </div>

            <!-- Sección: detalles -->
            <div class="form-section">
              <h2 class="card__subtitle" data-i18n="req_form_section_details">Detalles de la recolección</h2>
              <div class="stack">
                <div class="field">
                  <label for="ciudad"><span data-i18n="req_form_city">Ciudad</span> <span class="req">*</span></label>
                  <select id="ciudad" name="ciudad" class="select" th:disabled="${isEdit}" required>
                    <option value="" data-i18n="req_form_city_select">Seleccioná una ciudad</option>
                    <option th:each="c : ${cities}" th:value="${c}"
                            th:attr="data-i18n=${'req_city_' + #strings.toLowerCase(c.name())}"
                            th:text="${c.name()}" th:selected="${selectedCity != null and selectedCity == c}"></option>
                  </select>
                  <input th:if="${isEdit}" type="hidden" name="ciudad" th:value="${request.city}">
                </div>
                <div class="field">
                  <label for="organizationId">
                    <span data-i18n="req_form_org">Organización de acopio</span> <span class="req">*</span>
                    <svg class="icon hint" data-i18n-attr="title:req_form_org_tip" title="Los materiales disponibles se actualizan según lo que acepta cada organización"><use href="/images/icons.svg#circle-info"/></svg>
                  </label>
                  <select id="organizationId" name="organizationId" class="select" required th:disabled="${isEdit}">
                    <option value="" data-i18n="req_form_org_select">Primero seleccioná una ciudad</option>
                    <th:block th:if="${isEdit and organizations != null}">
                      <option th:each="org : ${organizations}" th:value="${org.id}"
                              th:attr="data-materials=${org.acceptedMaterialsCsv}"
                              th:text="${org.displayName}"
                              th:selected="${request.organization != null and request.organization.id == org.id}"></option>
                    </th:block>
                  </select>
                  <input th:if="${isEdit}" type="hidden" name="organizationId" th:value="${request.organization != null ? request.organization.id : ''}">
                </div>
                <div th:replace="~{fragments/forms :: text('address', 'address', 'text', 'req_form_address', 'Dirección', 'req_form_address_placeholder', 'Ej: Calle 123', true, ${request.address})}"></div>
                <div th:if="${isEdit}">
                  <div th:replace="~{fragments/forms :: text('addressReference', 'addressReference', 'text', 'req_form_address_ref', 'Referencia (opcional)', 'req_form_address_ref_placeholder', 'Ej: Casa esquinera', false, ${request.addressReference})}"></div>
                </div>
              </div>
            </div>

            <fieldset class="field">
              <legend><span data-i18n="req_form_materials">Materiales</span> <span class="req">*</span></legend>
            <span class="hint is-hidden" id="materialsLoading"><svg class="icon icon--spin"><use href="/images/icons.svg#spinner"/></svg> <span data-i18n="req_form_materials_loading">Actualizando materiales...</span></span>
            <div th:replace="~{fragments/forms :: checkGrid(${materials}, 'materials', ${request.materials}, 'mat_')}"></div>
          </fieldset>

          <div th:if="${isEdit}" class="field">
            <label data-i18n="req_form_timeslot">Franja horaria</label>
            <div class="radio-grid">
              <th:block th:each="slot : ${timeSlots}">
                <label class="radio-card">
                  <input type="radio" name="timeSlot" th:value="${slot.name()}"
                         th:checked="${request.confirmedSlot != null and request.confirmedSlot == slot}">
                  <svg class="icon" th:with="slotIcon=${slot.name() == 'MANANA'} ? 'sun' : (${slot.name() == 'TARDE'} ? 'cloud-sun' : 'moon')"><use th:attr="href=@{/images/icons.svg} + '#' + ${slotIcon}"/></svg>
                  <span th:attr="data-i18n=${'req_form_slot_' + #strings.toLowerCase(slot.name())}" th:text="${slot.name()}">MANANA</span>
                </label>
              </th:block>
            </div>
          </div>

          <div th:if="${isEdit}" class="field">
            <label data-i18n="req_form_image">Foto (opcional)</label>
            <label class="file-upload" for="imageFile">
              <svg class="icon"><use href="/images/icons.svg#cloud-arrow-up"/></svg>
              <span data-i18n="req_form_image_choose">Click para subir</span>
              <input type="file" id="imageFile" name="imageFile" accept="image/jpeg,image/png">
              <span class="file-name" id="fileName"></span>
            </label>
            <img th:if="${request.hasImage()}" th:src="${request.imageUrl}" th:alt="'Foto de la solicitud #' + ${request.id}" class="img-preview">
          </div>

            <div class="form-actions">
              <button type="submit" class="btn btn--primary">
                <svg class="icon"><use href="/images/icons.svg#paper-plane"/></svg>
                <span th:if="${isEdit}" data-i18n="req_form_submit_edit">Guardar cambios</span>
                <span th:unless="${isEdit}" data-i18n="req_form_submit_new">Pedir recolección</span>
              </button>
              <a th:href="${isEdit} ? '/mis-solicitudes' : '/'" class="btn btn--outline">
                <svg class="icon"><use href="/images/icons.svg#xmark"/></svg> <span data-i18n="req_form_cancel">Cancelar</span>
              </a>
            </div>
          </form>
        </section>

        <div th:replace="~{fragments/forms :: altCta('req_form_alt_user_title', 'req_form_alt_user_desc', '/mis-solicitudes', 'list', 'nav_my_requests')}"></div>
      </div>
    </div>
  </main>

  <th:block layout:fragment="pageScripts">
    <script th:src="@{/js/request-form.js}"></script>
  </th:block>
</body>
</html>

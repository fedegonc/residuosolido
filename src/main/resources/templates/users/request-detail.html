<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Residuo Sólido — Solicitud</title>
</head>
<body>
  <main layout:fragment="content">
    <div class="page panel-section page--narrow">

      <!-- Breadcrumbs -->
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="/">Inicio</a>
        <i class="fa-solid fa-chevron-right breadcrumb__sep"></i>
        <a href="/usuarios/inicio">Mi panel</a>
        <i class="fa-solid fa-chevron-right breadcrumb__sep"></i>
        <a href="/solicitudes" data-i18n="req_list_title">Mis solicitudes</a>
        <i class="fa-solid fa-chevron-right breadcrumb__sep"></i>
        <span>#<span th:text="${request.id}"></span></span>
      </nav>

      <!-- Header -->
      <div class="panel-header">
        <div>
          <h1 class="panel-header__title">
            <span data-i18n="req_detail_title">Detalle de solicitud</span>
            #<span th:text="${request.id}"></span>
          </h1>
          <span class="status-badge"
                th:classappend="${request.status.name() == 'PENDING'} ? 'status-badge--pending' :
                                 (${request.status.name() == 'IN_PROGRESS'} ? 'status-badge--in_progress' :
                                 (${request.status.name() == 'COMPLETED'} ? 'status-badge--completed' :
                                 'status-badge--rejected'))"
                th:text="${request.status.name() == 'PENDING'} ? 'Pendiente' :
                         (${request.status.name() == 'IN_PROGRESS'} ? 'En curso' :
                         (${request.status.name() == 'COMPLETED'} ? 'Completado' : 'Rechazado'))">
            Pendiente
          </span>
        </div>
        <div class="panel-actions">
          <a href="/solicitudes" class="btn btn--outline">
            <i class="fa-solid fa-arrow-left"></i>
            <span data-i18n="req_detail_back">Volver</span>
          </a>
          <a th:if="${request.canBeEdited()}"
             th:href="@{/solicitud/{id}/editar(id=${request.id})}" class="btn btn--outline">
            <i class="fa-solid fa-pen"></i>
            <span data-i18n="req_detail_edit">Editar</span>
          </a>
          <form th:if="${request.canBeDeleted()}"
                th:action="@{/solicitud/{id}/eliminar(id=${request.id})}" method="post"
                onsubmit="return confirm('¿Eliminar esta solicitud?');"
                style="display:inline;">
            <button type="submit" class="btn btn--outline" style="color:#b91c1c;border-color:#fecaca;">
              <i class="fa-solid fa-trash"></i>
              <span data-i18n="req_detail_delete">Eliminar</span>
            </button>
          </form>
        </div>
      </div>

      <!-- Detail info -->
      <div class="info-card">
        <h2 class="info-card__title" data-i18n="req_detail_status">Estado</h2>
        <div class="info-row">
          <i class="fa-solid fa-circle-info"></i>
          <span class="info-row__label" data-i18n="req_detail_status">Estado</span>
          <span class="status-badge"
                th:classappend="${request.status.name() == 'PENDING'} ? 'status-badge--pending' :
                                 (${request.status.name() == 'IN_PROGRESS'} ? 'status-badge--in_progress' :
                                 (${request.status.name() == 'COMPLETED'} ? 'status-badge--completed' :
                                 'status-badge--rejected'))"
                th:text="${request.status.name() == 'PENDING'} ? 'Pendiente' :
                         (${request.status.name() == 'IN_PROGRESS'} ? 'En curso' :
                         (${request.status.name() == 'COMPLETED'} ? 'Completado' : 'Rechazado'))">
            Pendiente
          </span>
        </div>
        <div class="info-row" th:if="${request.createdAt != null}">
          <i class="fa-solid fa-calendar"></i>
          <span class="info-row__label" data-i18n="req_detail_date">Fecha de creación</span>
          <span class="info-row__value" th:text="${#temporals.format(request.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
        </div>
      </div>

      <div class="info-card">
        <h2 class="info-card__title" data-i18n="req_detail_address">Dirección</h2>
        <div class="info-row" th:if="${request.city != null}">
          <i class="fa-solid fa-location-dot"></i>
          <span class="info-row__label" data-i18n="req_detail_city">Ciudad</span>
          <span class="info-row__value" th:text="${request.city}"></span>
        </div>
        <div class="info-row" th:if="${request.address != null and !request.address.isBlank()}">
          <i class="fa-solid fa-route"></i>
          <span class="info-row__label" data-i18n="req_detail_address">Dirección</span>
          <span class="info-row__value" th:text="${request.address}"></span>
        </div>
        <div class="info-row" th:if="${request.addressReference != null and !request.addressReference.isBlank()}">
          <i class="fa-solid fa-flag"></i>
          <span class="info-row__label" data-i18n="req_detail_ref">Referencia</span>
          <span class="info-row__value" th:text="${request.addressReference}"></span>
        </div>
      </div>

      <div class="info-card">
        <h2 class="info-card__title" data-i18n="req_detail_materials">Materiales</h2>
        <div th:if="${request.hasMaterials()}" class="request-item__materials">
          <span th:each="mat : ${request.materials}" class="material-tag" th:text="${mat.name()}"></span>
        </div>
        <p th:unless="${request.hasMaterials()}" class="info-row__empty">—</p>
      </div>

      <div class="info-card">
        <h2 class="info-card__title" data-i18n="req_detail_org">Organización</h2>
        <div class="info-row" th:if="${request.organization != null}">
          <i class="fa-solid fa-building"></i>
          <span class="info-row__label" data-i18n="req_detail_org">Organización</span>
          <span class="info-row__value" th:text="${request.organization.displayName}"></span>
        </div>
        <div class="info-row" th:if="${request.organization == null}">
          <i class="fa-solid fa-building"></i>
          <span class="info-row__label" data-i18n="req_detail_org">Organización</span>
          <span class="info-row__empty" data-i18n="req_detail_no_org">Sin asignar</span>
        </div>
        <div class="info-row" th:if="${request.confirmedSlot != null}">
          <i class="fa-solid fa-clock"></i>
          <span class="info-row__label" data-i18n="req_detail_slot">Franja confirmada</span>
          <span class="info-row__value" th:text="${request.confirmedSlot}"></span>
        </div>
        <div class="info-row" th:if="${request.confirmedSlot == null}">
          <i class="fa-solid fa-clock"></i>
          <span class="info-row__label" data-i18n="req_detail_slot">Franja confirmada</span>
          <span class="info-row__empty" data-i18n="req_detail_no_slot">Sin confirmar</span>
        </div>
      </div>

      <!-- Image -->
      <div th:if="${request.hasImage()}" class="info-card">
        <h2 class="info-card__title" data-i18n="req_detail_image">Foto</h2>
        <img th:src="${request.imageUrl}" alt="Foto de materiales"
             style="width:100%;border-radius:var(--radius);border:1px solid var(--border);">
      </div>

    </div>
  </main>
</body>
</html>

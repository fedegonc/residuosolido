<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Residuo Sólido — Panel</title>
</head>
<body>
  <main layout:fragment="content">
    <div class="page panel-section">

      <!-- Breadcrumbs -->
      <nav class="breadcrumb" aria-label="breadcrumb">
        <th:block th:each="crumb, iter : ${breadcrumbs}">
          <a th:if="${crumb.href != ''}" th:href="${crumb.href}" th:text="${crumb.label}">Inicio</a>
          <span th:unless="${crumb.href != ''}" th:text="${crumb.label}">Mi panel</span>
          <i th:if="${!iter.last}" class="fa-solid fa-chevron-right breadcrumb__sep"></i>
        </th:block>
      </nav>

      <!-- Header -->
      <div class="panel-header">
        <div>
          <h1 class="panel-header__title">
            <span data-i18n="dash_welcome">Hola</span>,
            <span th:text="${user.displayName}"></span>
          </h1>
          <p class="panel-header__subtitle" data-i18n="dash_recent">Solicitudes recientes</p>
        </div>
        <div class="panel-actions">
          <a href="/solicitudes/nueva" class="btn btn--primary">
            <i class="fa-solid fa-plus"></i>
            <span data-i18n="dash_new_request">Nueva solicitud</span>
          </a>
          <a href="/solicitudes" class="btn btn--outline">
            <i class="fa-solid fa-list"></i>
            <span data-i18n="dash_view_all">Ver todas</span>
          </a>
        </div>
      </div>

      <!-- Recent requests -->
      <div th:if="${recentRequests != null and !recentRequests.isEmpty()}">
        <div class="request-list">
          <div th:each="req : ${recentRequests}" class="request-item">
            <div class="request-item__header">
              <span class="request-item__id">
                <span data-i18n="track_request_id">Solicitud</span>
                #<span th:text="${req.id}"></span>
              </span>
              <span class="status-badge"
                    th:classappend="${req.status.name() == 'PENDING'} ? 'status-badge--pending' :
                                     (${req.status.name() == 'IN_PROGRESS'} ? 'status-badge--in_progress' :
                                     (${req.status.name() == 'COMPLETED'} ? 'status-badge--completed' :
                                     'status-badge--rejected'))"
                    th:text="${req.status.name() == 'PENDING'} ? 'Pendiente' :
                             (${req.status.name() == 'IN_PROGRESS'} ? 'En curso' :
                             (${req.status.name() == 'COMPLETED'} ? 'Completado' : 'Rechazado'))">
                Pendiente
              </span>
            </div>
            <div class="request-item__body">
              <div class="request-item__row" th:if="${req.createdAt != null}">
                <i class="fa-solid fa-calendar"></i>
                <span th:text="${#temporals.format(req.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
              </div>
              <div class="request-item__row" th:if="${req.city != null}">
                <i class="fa-solid fa-location-dot"></i>
                <span th:text="${req.city}"></span>
              </div>
              <div th:if="${req.hasMaterials()}" class="request-item__materials">
                <span th:each="mat : ${req.materials}" class="material-tag" th:text="${mat.name()}"></span>
              </div>
              <div class="request-item__row" th:if="${req.organization != null}">
                <i class="fa-solid fa-building"></i>
                <span th:text="${req.organization.displayName}"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty state -->
      <div th:if="${recentRequests == null or recentRequests.isEmpty()}" class="info-card">
        <div class="track-empty">
          <div class="track-empty__illustration">
            <i class="fa-solid fa-clipboard-list"></i>
          </div>
          <h2 class="track-empty__title" data-i18n="dash_no_requests">No tenés solicitudes todavía</h2>
          <p class="track-empty__text" data-i18n="dash_no_requests_desc">Creá tu primera solicitud de recolección</p>
          <a href="/solicitudes/nueva" class="btn btn--primary btn--lg" style="margin-top:.75rem;">
            <i class="fa-solid fa-plus"></i>
            <span data-i18n="dash_new_request">Nueva solicitud</span>
          </a>
        </div>
      </div>

    </div>
  </main>
</body>
</html>

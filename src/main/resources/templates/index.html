<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/app-layout}">
<head>
    <title th:text="#{index.title}">Residuo Sólido - Recolección de reciclables</title>
</head>
<body>
<main layout:fragment="content">
    <div class="page page--wide page--center">
        <div class="flex mb-6">
            <div class="index-hero__icon">
                <i aria-hidden="true" class="fa-solid fa-recycle"></i>
            </div>
        </div>
        <h1 class="index-hero__title" th:text="#{index.welcome}">Residuo Sólido</h1>
        <p class="index-hero__subtitle" th:text="#{index.subtitle}">Solicitá la recolección de tus reciclables. Una cooperativa de tu ciudad los pasa a buscar.</p>
        <div class="flex flex-wrap gap-3">
            <a href="/solicitudes/nueva" class="btn btn--green btn--lg">
                <i aria-hidden="true" class="fa-solid fa-paper-plane"></i><span th:text="#{index.send_request}">Enviar solicitud</span>
            </a>
            <a href="/rastrear" class="btn btn--ghost btn--lg">
                <i aria-hidden="true" class="fa-solid fa-magnifying-glass"></i><span th:text="#{index.track}">Rastrear solicitud</span>
            </a>
            <a href="/auth/login" class="btn btn--ghost btn--lg">
                <i aria-hidden="true" class="fa-solid fa-right-to-bracket"></i><span th:text="#{index.login}">Entrar</span>
            </a>
        </div>
    </div>
</main>
</body>
</html>

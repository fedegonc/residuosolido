<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Residuo Sólido — Perfil de organización</title>
</head>
<body>
  <main layout:fragment="content">
    <div class="page panel-section">

      <!-- Breadcrumbs -->
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="/">Inicio</a>
        <i class="fa-solid fa-chevron-right breadcrumb__sep"></i>
        <a href="/acopio/inicio" data-i18n="org_dash_title">Panel de acopio</a>
        <i class="fa-solid fa-chevron-right breadcrumb__sep"></i>
        <span data-i18n="org_profile_title">Perfil de organización</span>
      </nav>

      <!-- Header -->
      <div class="panel-header">
        <h1 class="panel-header__title" data-i18n="org_profile_title">Perfil de organización</h1>
        <button type="button" class="btn btn--outline" id="editToggle">
          <i class="fa-solid fa-pen"></i>
          <span data-i18n="org_profile_edit">Editar perfil</span>
        </button>
      </div>

      <div class="form-grid--2" style="grid-template-columns:1fr;gap:1rem;">

        <!-- View card -->
        <div class="info-card" id="viewCard">
          <h2 class="info-card__title" data-i18n="org_profile_info">Información de la organización</h2>
          <div class="info-row">
            <i class="fa-solid fa-building"></i>
            <span class="info-row__label" data-i18n="org_profile_name">Nombre</span>
            <span class="info-row__value" th:text="${organization.displayName}"></span>
          </div>
          <div class="info-row">
            <i class="fa-solid fa-user"></i>
            <span class="info-row__label" data-i18n="profile_username">Usuario</span>
            <span class="info-row__value" th:text="${organization.username}"></span>
          </div>
          <div class="info-row">
            <i class="fa-solid fa-envelope"></i>
            <span class="info-row__label" data-i18n="profile_email">Email</span>
            <span class="info-row__value" th:text="${organization.email}"></span>
          </div>
          <div class="info-row">
            <i class="fa-solid fa-phone"></i>
            <span class="info-row__label" data-i18n="profile_phone">Teléfono</span>
            <span class="info-row__value" th:if="${organization.hasPhone()}" th:text="${organization.phone}"></span>
            <span class="info-row__empty" th:unless="${organization.hasPhone()}" data-i18n="profile_no_phone">Sin teléfono</span>
          </div>
          <div class="info-row">
            <i class="fa-solid fa-location-dot"></i>
            <span class="info-row__label" data-i18n="profile_city">Ciudad</span>
            <span class="info-row__value" th:if="${organization.hasCity()}" th:text="${organization.city}"></span>
            <span class="info-row__empty" th:unless="${organization.hasCity()}" data-i18n="profile_no_city">Sin ciudad</span>
          </div>
        </div>

        <!-- Edit card -->
        <div class="info-card is-hidden" id="editCard">
          <h2 class="info-card__title" data-i18n="org_profile_edit_title">Editar datos</h2>
          <form action="/acopio/perfil" method="post" class="auth-form">
            <div class="form-group">
              <label for="firstName" data-i18n="org_profile_name_label">Nombre de la organización</label>
              <input type="text" id="firstName" name="firstName" class="form-input" th:value="${organization.firstName}">
            </div>
            <div class="form-group">
              <label for="email" data-i18n="profile_email_label">Email</label>
              <input type="email" id="email" name="email" class="form-input" th:value="${organization.email}" required>
            </div>
            <div class="form-group">
              <label for="phone" data-i18n="profile_phone_label">Teléfono</label>
              <input type="tel" id="phone" name="phone" class="form-input" th:value="${organization.phone}">
            </div>
            <div class="form-group">
              <label for="city" data-i18n="profile_city_label">Ciudad</label>
              <select id="city" name="city" class="form-select">
                <option value="" data-i18n="profile_city_select">Seleccioná una ciudad</option>
                <option th:each="c : ${cities}" th:value="${c}" th:text="${c.name()}"
                        th:selected="${organization.city != null and organization.city == c}"></option>
              </select>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn--primary">
                <i class="fa-solid fa-check"></i>
                <span data-i18n="profile_save">Guardar</span>
              </button>
              <button type="button" class="btn btn--outline" id="cancelEdit">
                <i class="fa-solid fa-xmark"></i>
                <span data-i18n="profile_cancel">Cancelar</span>
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>

    <script>
    (function () {
      var editToggle = document.getElementById('editToggle');
      var viewCard = document.getElementById('viewCard');
      var editCard = document.getElementById('editCard');
      var cancelEdit = document.getElementById('cancelEdit');

      if (editToggle && viewCard && editCard) {
        editToggle.addEventListener('click', function () {
          viewCard.classList.add('is-hidden');
          editCard.classList.remove('is-hidden');
        });
      }
      if (cancelEdit && viewCard && editCard) {
        cancelEdit.addEventListener('click', function () {
          editCard.classList.add('is-hidden');
          viewCard.classList.remove('is-hidden');
        });
      }
    })();
    </script>
  </main>
</body>
</html>

<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Completar perfil</title></head>
<body>
  <main layout:fragment="content">
    <div class="page page--narrow center">
      <div class="card">
        <h1 class="card__title" data-i18n="onboard_title">Completá tu perfil</h1>
        <p class="card__subtitle" data-i18n="onboard_subtitle">Necesitamos estos datos para que los ciudadanos puedan contactarte</p>
        <form th:action="@{/acopio/completar-perfil}" method="post" class="stack">
          <div class="field">
            <label data-i18n="onboard_org_name">Organización</label>
            <input type="text" class="input" th:value="${organization.displayName}" disabled>
          </div>
          <div class="field">
            <label for="phone" data-i18n="onboard_phone">Teléfono de contacto</label>
            <input type="tel" id="phone" name="phone" class="input" th:value="${organization.phone}"
                   data-i18n-attr="placeholder:onboard_phone_placeholder" placeholder="Ej: +598 99 123 456" required>
          </div>
          <div class="field">
            <label for="city" data-i18n="onboard_city">Ciudad</label>
            <select id="city" name="city" class="select" required>
              <option value="" data-i18n="onboard_city_select">Seleccioná una ciudad</option>
              <option th:each="c : ${cities}" th:value="${c}" th:attr="data-i18n=${'city_' + #strings.toLowerCase(c.name())}" th:text="${c.name()}" th:selected="${organization.city != null and organization.city == c}"></option>
            </select>
          </div>
          <button type="submit" class="btn btn--primary btn--block"><i class="fa-solid fa-check"></i> <span data-i18n="onboard_submit">Completar perfil</span></button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>

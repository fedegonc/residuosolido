<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Solicitudes de acopio</title></head>
<body>
  <main layout:fragment="content">
    <div class="org-layout">
      <div th:replace="~{fragments/org-sidebar :: sidebar('requests')}"></div>
      <div class="org-layout__main">

      <nav class="breadcrumb">
        <th:block th:each="crumb, iter : ${breadcrumbs}">
          <a th:if="${crumb.href != ''}" th:href="${crumb.href}" th:text="${crumb.label}">Inicio</a>
          <span th:unless="${crumb.href != ''}" th:text="${crumb.label}">Solicitudes</span>
          <i th:if="${!iter.last}" class="fa-solid fa-chevron-right breadcrumb__sep"></i>
        </th:block>
      </nav>

      <!-- ═══ LIST VIEW ═══ -->
      <th:block th:if="${viewType == 'list'}">
        <div class="row row--between mb">
          <h1 class="card__title" data-i18n="org_req_title">Solicitudes</h1>
          <a href="/acopio/inicio" class="btn btn--outline"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="org_req_back_dashboard">Volver</span></a>
        </div>

        <div class="row mb">
          <a href="/acopio/requests" class="btn btn--outline btn--sm" th:classappend="${currentStatus == null} ? 'btn--primary' : ''"><span data-i18n="org_req_filter_all">Todas</span></a>
          <a href="/acopio/requests?status=PENDING" class="btn btn--outline btn--sm" th:classappend="${currentStatus == 'PENDING'} ? 'btn--primary' : ''"><span data-i18n="req_status_pending">Pendientes</span></a>
          <a href="/acopio/requests?status=IN_PROGRESS" class="btn btn--outline btn--sm" th:classappend="${currentStatus == 'IN_PROGRESS'} ? 'btn--primary' : ''"><span data-i18n="req_status_in_progress">En curso</span></a>
          <a href="/acopio/requests?status=COMPLETED" class="btn btn--outline btn--sm" th:classappend="${currentStatus == 'COMPLETED'} ? 'btn--primary' : ''"><span data-i18n="req_status_completed">Completadas</span></a>
          <a href="/acopio/requests?status=REJECTED" class="btn btn--outline btn--sm" th:classappend="${currentStatus == 'REJECTED'} ? 'btn--primary' : ''"><span data-i18n="req_status_rejected">Rechazadas</span></a>
        </div>

        <div th:if="${requests != null and !requests.isEmpty()}" class="request-list">
          <div th:each="req : ${requests}" class="request-item">
            <th:block th:replace="~{fragments/request-list :: request-item-card(req=${req})}"></th:block>
            <div class="form-actions">
              <a th:href="@{/acopio/requests/{id}(id=${req.id})}" class="btn btn--outline btn--sm"><i class="fa-solid fa-eye"></i> <span data-i18n="req_list_view">Ver</span></a>
            </div>
          </div>
        </div>
        <div th:if="${requests == null or requests.isEmpty()}">
          <div th:replace="~{fragments/empty-state :: state('fa-inbox', 'No hay solicitudes')}"></div>
        </div>
      </th:block>

      <!-- ═══ DETAIL VIEW ═══ -->
      <th:block th:if="${viewType == 'detail'}">
        <div class="row row--between mb">
          <div>
            <h1 class="card__title"><span data-i18n="req_detail_title">Solicitud</span> #<span th:text="${request.id}"></span></h1>
            <div th:replace="~{fragments/badge :: status(${request.status})}"></div>
          </div>
          <a href="/acopio/requests" class="btn btn--outline"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="req_detail_back">Volver</span></a>
        </div>

        <div class="card mb">
          <h2 class="card__subtitle" data-i18n="org_req_contact">Contacto</h2>
          <div th:replace="~{fragments/info-row :: row('fa-user', 'Nombre', ${request.contactName})}"></div>
          <div th:replace="~{fragments/info-row :: row('fa-phone', 'Teléfono', ${request.contactPhone})}"></div>
          <div th:replace="~{fragments/info-row :: row('fa-user-tag', 'Tipo', ${request.isGuest() ? 'Invitado' : 'Registrado'})}"></div>
        </div>

        <div class="card mb">
          <h2 class="card__subtitle" data-i18n="req_detail_address">Dirección</h2>
          <div th:replace="~{fragments/info-row :: row('fa-location-dot', 'Ciudad', ${request.city != null ? request.city.toString() : null})}"></div>
          <div th:replace="~{fragments/info-row :: row('fa-route', 'Dirección', ${request.address})}"></div>
          <div th:replace="~{fragments/info-row :: row('fa-flag', 'Referencia', ${request.addressReference})}"></div>
        </div>

        <div class="card mb">
          <h2 class="card__subtitle" data-i18n="req_detail_materials">Materiales</h2>
          <div th:if="${request.hasMaterials()}" class="request-item__materials">
            <span th:each="mat : ${request.materials}" class="tag" th:text="${mat.name()}"></span>
          </div>
          <span th:unless="${request.hasMaterials()}">—</span>
        </div>

        <div th:if="${request.hasImage()}" class="card mb">
          <h2 class="card__subtitle" data-i18n="req_detail_image">Foto</h2>
          <img th:src="${request.imageUrl}" alt="Foto" class="img-detail">
        </div>

        <div th:if="${request.confirmedSlot != null}" class="card mb">
          <h2 class="card__subtitle" data-i18n="req_detail_slot">Franja confirmada</h2>
          <div class="info-row"><i class="fa-solid fa-clock"></i><span th:text="${request.confirmedSlot}"></span></div>
        </div>

        <div th:if="${request.isPending()}" class="card mb">
          <h2 class="card__subtitle" data-i18n="org_req_accept_title">Aceptar solicitud</h2>
          <form th:action="@{/acopio/requests/{id}/transition(id=${request.id})}" method="post" class="stack">
            <input type="hidden" name="action" value="accept" />
            <div class="field">
              <label for="confirmedSlot" data-i18n="org_req_select_slot">Confirmar franja</label>
              <select id="confirmedSlot" name="confirmedSlot" class="select" required>
                <option th:each="slot : ${timeSlots}" th:value="${slot}" th:text="${slot.name()}"></option>
              </select>
            </div>
            <div class="row">
              <button type="submit" class="btn btn--primary"><i class="fa-solid fa-check"></i> <span data-i18n="org_req_accept">Aceptar</span></button>
              <button type="button" class="btn btn--outline btn--danger" onclick="document.getElementById('rejectForm').classList.remove('is-hidden');this.classList.add('is-hidden')"><i class="fa-solid fa-xmark"></i> <span data-i18n="org_req_reject">Rechazar</span></button>
            </div>
          </form>
          <form id="rejectForm" th:action="@{/acopio/requests/{id}/transition(id=${request.id})}" method="post" class="is-hidden mt">
            <input type="hidden" name="action" value="reject" />
            <p class="hint mb-sm" data-i18n="org_req_reject_confirm">¿Confirmás el rechazo?</p>
            <div class="row">
              <button type="submit" class="btn btn--outline btn--danger"><i class="fa-solid fa-xmark"></i> <span data-i18n="org_req_reject_confirm_btn">Sí, rechazar</span></button>
              <button type="button" class="btn btn--outline" onclick="document.getElementById('rejectForm').classList.add('is-hidden')"><span data-i18n="profile_cancel">Cancelar</span></button>
            </div>
          </form>
        </div>

        <div th:if="${request.isInProgress()}" class="card mb">
          <h2 class="card__subtitle" data-i18n="org_req_complete_title">Finalizar recolección</h2>
          <form th:action="@{/acopio/requests/{id}/transition(id=${request.id})}" method="post">
            <input type="hidden" name="action" value="complete" />
            <button type="submit" class="btn btn--primary"><i class="fa-solid fa-circle-check"></i> <span data-i18n="org_req_complete">Marcar como completada</span></button>
          </form>
        </div>
      </th:block>

      </div>
    </div>
  </main>
</body>
</html>

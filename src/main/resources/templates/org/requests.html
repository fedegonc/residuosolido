<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Solicitudes de acopio</title></head>
<body>
  <main layout:fragment="content">

      <nav th:replace="~{fragments/ui :: trail(${breadcrumbs})}"></nav>

      <!-- ═══ LIST VIEW ═══ -->
      <th:block th:if="${viewType == T(com.residuosolido.app.enums.RequestViewType).LIST}">
        <div class="row row--between mb">
          <h1 class="card__title" data-i18n="org_req_title">Solicitudes</h1>
        </div>

        <div class="grid grid--3 mb-lg">
          <div th:replace="~{fragments/ui :: tile('clock', ${pendingCount}, 'dash_stat_pending', 'Pendientes')}"></div>
          <div th:replace="~{fragments/ui :: tile('truck', ${inProgressCount}, 'dash_stat_progress', 'En curso')}"></div>
          <div th:replace="~{fragments/ui :: tile('circle-check', ${completedCount}, 'dash_stat_completed', 'Completadas')}"></div>
        </div>

        <div class="row mb">
          <a href="/acopio/solicitudes" class="btn btn--outline btn--sm" th:classappend="${currentStatus == null} ? 'btn--primary' : ''"><span data-i18n="org_req_filter_all">Todas</span></a>
          <a href="/acopio/solicitudes?estado=PENDING" class="btn btn--outline btn--sm" th:classappend="${currentStatus == 'PENDING'} ? 'btn--primary' : ''"><span data-i18n="req_status_pending">Pendientes</span></a>
          <a href="/acopio/solicitudes?estado=IN_PROGRESS" class="btn btn--outline btn--sm" th:classappend="${currentStatus == 'IN_PROGRESS'} ? 'btn--primary' : ''"><span data-i18n="req_status_in_progress">En curso</span></a>
          <a href="/acopio/solicitudes?estado=COMPLETED" class="btn btn--outline btn--sm" th:classappend="${currentStatus == 'COMPLETED'} ? 'btn--primary' : ''"><span data-i18n="req_status_completed">Completadas</span></a>
          <a href="/acopio/solicitudes?estado=REJECTED" class="btn btn--outline btn--sm" th:classappend="${currentStatus == 'REJECTED'} ? 'btn--primary' : ''"><span data-i18n="req_status_rejected">Rechazadas</span></a>
        </div>

        <div th:if="${requests != null and !requests.isEmpty()}" class="request-list">
          <div th:each="req : ${requests}" class="request-item">
            <th:block th:replace="~{fragments/request-list :: request-item-card(req=${req})}"></th:block>
            <div class="form-actions">
              <a th:href="@{/acopio/solicitudes/{id}(id=${req.id})}" class="btn btn--outline btn--sm"><svg class="icon"><use href="/images/icons.svg#eye"/></svg> <span data-i18n="req_list_view">Ver</span></a>
            </div>
          </div>
        </div>
        <div th:if="${requests == null or requests.isEmpty()}">
          <div th:replace="~{fragments/ui :: state('inbox', 'No hay solicitudes')}"></div>
        </div>

        <div th:replace="~{fragments/ui :: educationalLinks(cards=${cards})}"></div>
      </th:block>

      <!-- ═══ DETAIL VIEW ═══ -->
      <th:block th:if="${viewType == T(com.residuosolido.app.enums.RequestViewType).DETAIL}">
        <div class="row row--between mb">
          <div>
            <h1 class="card__title"><span data-i18n="req_detail_title">Solicitud</span> #<span th:text="${request.id}"></span></h1>
            <div th:replace="~{fragments/ui :: status(${request.status})}"></div>
          </div>
          <a href="/acopio/solicitudes" class="btn btn--outline"><svg class="icon"><use href="/images/icons.svg#arrow-left"/></svg> <span data-i18n="req_detail_back">Volver</span></a>
        </div>

        <div class="card mb">
          <h2 class="card__subtitle" data-i18n="org_req_contact">Contacto</h2>
          <div th:replace="~{fragments/ui :: row('user', 'Nombre', ${request.contactName})}"></div>
          <div th:replace="~{fragments/ui :: row('phone', 'Teléfono', ${request.contactPhone})}"></div>
          <div th:replace="~{fragments/ui :: row('user-tag', 'Tipo', ${request.isGuest() ? 'Invitado' : 'Registrado'})}"></div>

          <div class="divider">
            <h2 class="card__subtitle" data-i18n="req_detail_address">Dirección</h2>
            <div th:replace="~{fragments/ui :: row('location-dot', 'Ciudad', ${request.city != null ? request.city.toString() : null})}"></div>
            <div th:replace="~{fragments/ui :: row('route', 'Dirección', ${request.address})}"></div>
            <div th:replace="~{fragments/ui :: row('flag', 'Referencia', ${request.addressReference})}"></div>
          </div>

          <div class="divider">
            <h2 class="card__subtitle" data-i18n="req_detail_materials">Materiales</h2>
            <div th:if="${request.hasMaterials()}" class="request-item__materials">
              <span th:each="mat : ${request.materials}" class="tag" th:text="${mat.name()}"></span>
            </div>
            <span th:unless="${request.hasMaterials()}">—</span>
          </div>

          <div th:if="${request.hasImage()}" class="divider">
            <h2 class="card__subtitle" data-i18n="req_detail_image">Foto</h2>
            <img th:src="${request.imageUrl}" th:alt="'Foto de la solicitud #' + ${request.id}" class="img-detail">
          </div>

          <div th:if="${request.confirmedSlot != null}" class="divider">
            <h2 class="card__subtitle" data-i18n="req_detail_slot">Franja confirmada</h2>
            <div class="info-row"><svg class="icon"><use href="/images/icons.svg#clock"/></svg><span th:text="${request.confirmedSlot}"></span></div>
          </div>
        </div>

        <div th:if="${request.isPending()}" class="card mb">
          <h2 class="card__subtitle" data-i18n="org_req_accept_title">Aceptar solicitud</h2>
          <form th:action="@{/acopio/solicitudes/{id}/aceptar(id=${request.id})}" method="post" class="stack">
            <div class="field">
              <label for="confirmedSlot" data-i18n="org_req_select_slot">Confirmar franja</label>
              <select id="confirmedSlot" name="confirmedSlot" class="select" required>
                <option th:each="slot : ${timeSlots}" th:value="${slot}" th:text="${slot.name()}"></option>
              </select>
            </div>
            <div class="row">
              <button type="submit" class="btn btn--primary"><svg class="icon"><use href="/images/icons.svg#check"/></svg> <span data-i18n="org_req_accept">Aceptar</span></button>
              <button type="button" id="rejectToggle" class="btn btn--outline btn--danger"><svg class="icon"><use href="/images/icons.svg#xmark"/></svg> <span data-i18n="org_req_reject">Rechazar</span></button>
            </div>
          </form>
          <form id="rejectForm" th:action="@{/acopio/solicitudes/{id}/rechazar(id=${request.id})}" method="post" class="is-hidden mt">
            <p class="hint mb-sm" data-i18n="org_req_reject_confirm">¿Confirmás el rechazo?</p>
            <div class="row">
              <button type="submit" class="btn btn--outline btn--danger"><svg class="icon"><use href="/images/icons.svg#xmark"/></svg> <span data-i18n="org_req_reject_confirm_btn">Sí, rechazar</span></button>
              <button type="button" id="rejectCancel" class="btn btn--outline"><span data-i18n="profile_cancel">Cancelar</span></button>
            </div>
          </form>
        </div>

        <div th:if="${request.isInProgress()}" class="card mb">
          <h2 class="card__subtitle" data-i18n="org_req_complete_title">Finalizar recolección</h2>
          <form th:action="@{/acopio/solicitudes/{id}/completar(id=${request.id})}" method="post">
            <button type="submit" class="btn btn--primary"><svg class="icon"><use href="/images/icons.svg#circle-check"/></svg> <span data-i18n="org_req_complete">Marcar como completada</span></button>
          </form>
        </div>
      </th:block>

  </main>
</body>
</html>

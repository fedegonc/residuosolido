<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base-sidebar}">
<head><title>Panel de acopio</title></head>
<body>
  <aside layout:fragment="sidebar">
    <div th:replace="~{fragments/org-sidebar :: sidebar('dashboard')}"></div>
  </aside>

  <div layout:fragment="pageContent">
        <nav th:replace="~{fragments/ui :: trail(${breadcrumbs})}"></nav>

        <div class="row row--between mb-lg">
          <div th:replace="~{fragments/ui :: greeting('org_dash_greeting', '¡Hola', ${user.displayName}, true, 'org_dash_subtitle', 'Solicitudes pendientes, en curso y completadas de tu organización.')}"></div>
          <div class="row">
            <a href="/acopio/requests" class="btn btn--outline"><i class="fa-solid fa-list"></i> <span data-i18n="org_dash_requests">Lista</span></a>
            <a href="/acopio/perfil" class="btn btn--outline"><i class="fa-solid fa-building"></i> <span data-i18n="org_profile_title">Perfil</span></a>
          </div>
        </div>

        <div class="grid grid--3 mb-lg">
          <div th:replace="~{fragments/ui :: tile('fa-clock', ${pendingRequests}, 'dash_stat_pending', 'Pendientes')}"></div>
          <div th:replace="~{fragments/ui :: tile('fa-truck', ${inProgressRequests}, 'dash_stat_progress', 'En curso')}"></div>
          <div th:replace="~{fragments/ui :: tile('fa-circle-check', ${completedRequests}, 'dash_stat_completed', 'Completadas')}"></div>
        </div>

        <h2 class="card__subtitle mb" data-i18n="org_kanban_title">Tablero de solicitudes</h2>

        <!-- T(...) no se puede usar dentro de los argumentos de un fragment call (Thymeleaf
             lo prohíbe por seguridad: "Instantiation of new objects... is forbidden in this
             context"). Se resuelve antes con th:with y se pasan variables simples. -->
        <div class="kanban"
             th:with="pending=${T(com.residuosolido.app.enums.RequestStatus).PENDING},
                      inProgress=${T(com.residuosolido.app.enums.RequestStatus).IN_PROGRESS},
                      completed=${T(com.residuosolido.app.enums.RequestStatus).COMPLETED},
                      rejected=${T(com.residuosolido.app.enums.RequestStatus).REJECTED}">
          <div th:replace="~{fragments/kanban-column :: column(${pending}, ${kanban.get(pending)}, ${timeSlots})}"></div>
          <div th:replace="~{fragments/kanban-column :: column(${inProgress}, ${kanban.get(inProgress)}, ${timeSlots})}"></div>
          <div th:replace="~{fragments/kanban-column :: column(${completed}, ${kanban.get(completed)}, ${timeSlots})}"></div>
          <div th:replace="~{fragments/kanban-column :: column(${rejected}, ${kanban.get(rejected)}, ${timeSlots})}"></div>
        </div>
  </div>
</body>
</html>

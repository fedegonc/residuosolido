<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/app-layout}">
<head>
    <title th:text="#{metrics.title}">Métricas públicas</title>
</head>
<body>
<main layout:fragment="content">
    <div class="page page--wide page--padded page--padded-lg">
        <h1 class="page-header__title page-header__title--xl" th:text="#{metrics.title}">Métricas públicas</h1>
        <p class="page-header__subtitle page-header__subtitle--lg" th:text="#{metrics.subtitle}">Solicitudes completadas por ciudad.</p>

        <div th:if="${metrics.isEmpty()}" class="info-box info-box--blue" th:text="#{metrics.empty}">
            Aún no hay recolecciones completadas.
        </div>

        <table th:unless="${metrics.isEmpty()}" class="table">
            <thead>
                <tr>
                    <th th:text="#{metrics.city}">Ciudad</th>
                    <th class="text-right" th:text="#{metrics.completedCount}">Completadas</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="entry : ${metrics}">
                    <td th:text="${#strings.capitalize(#strings.toLowerCase(entry.key))}">Rivera</td>
                    <td class="text-right" th:text="${entry.value}">0</td>
                </tr>
                <tr class="table__row--total">
                    <td th:text="#{metrics.total}">Total</td>
                    <td class="text-right" th:text="${total}">0</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>

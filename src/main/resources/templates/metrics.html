<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/app-layout}">
<head>
    <title th:text="#{metrics.title}">Métricas públicas</title>
</head>
<body>
<main layout:fragment="content">
    <div class="page" style="max-width:48rem;padding-top:3rem;padding-bottom:3rem;">
        <h1 style="font-size:2rem;font-weight:800;color:var(--gray-900);margin-bottom:.5rem;" th:text="#{metrics.title}">Métricas públicas</h1>
        <p style="font-size:1.125rem;color:var(--gray-600);margin-bottom:2rem;" th:text="#{metrics.subtitle}">Solicitudes completadas por ciudad.</p>

        <div th:if="${metrics.isEmpty()}" style="padding:1.5rem;background:var(--gray-50);border-radius:var(--radius-lg);color:var(--gray-600);" th:text="#{metrics.empty}">
            Aún no hay recolecciones completadas.
        </div>

        <table th:unless="${metrics.isEmpty()}" style="width:100%;border-collapse:collapse;">
            <thead>
                <tr style="border-bottom:1px solid var(--gray-200);">
                    <th style="text-align:left;padding:.75rem;font-weight:600;color:var(--gray-700);" th:text="#{metrics.city}">Ciudad</th>
                    <th style="text-align:right;padding:.75rem;font-weight:600;color:var(--gray-700);" th:text="#{metrics.completedCount}">Completadas</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="entry : ${metrics}" style="border-bottom:1px solid var(--gray-100);">
                    <td style="padding:.75rem;color:var(--gray-800);" th:text="${#strings.capitalize(#strings.toLowerCase(entry.key))}">Rivera</td>
                    <td style="padding:.75rem;text-align:right;color:var(--gray-800);" th:text="${entry.value}">0</td>
                </tr>
                <tr style="font-weight:700;background:var(--gray-50);">
                    <td style="padding:.75rem;color:var(--gray-900);" th:text="#{metrics.total}">Total</td>
                    <td style="padding:.75rem;text-align:right;color:var(--gray-900);" th:text="${total}">0</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/app-layout}">
<head>
    <title>404 — Recurso no encontrado</title>
</head>
<body>
<main layout:fragment="content">
    <div class="page page--center">
        <div class="empty-state empty-state--xl">
            <i aria-hidden="true" class="fa-solid fa-compass empty-state__icon"></i>
            <h1 class="text-2xl font-bold text-gray-900">404</h1>
            <p class="text-sm text-gray-600 mb-4" th:text="#{error.404.message}">El recurso solicitado no fue encontrado.</p>
            <a href="/" class="btn btn--green">
                <i aria-hidden="true" class="fa-solid fa-arrow-left"></i>
                <span th:text="#{error.404.back}">Volver al inicio</span>
            </a>
        </div>
    </div>
</main>
</body>
</html>

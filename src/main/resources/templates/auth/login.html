<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Residuo Sólido — Iniciar sesión</title>
</head>
<body>
  <main layout:fragment="content">
    <div class="auth-split">
      <div class="auth-split__intro">
        <span class="auth-split__badge">
          <i class="fa-solid fa-leaf"></i>
          <span data-i18n="auth_welcome_badge">Juntos por una ciudad más limpia y sustentable</span>
        </span>
        <h1 class="auth-split__title" data-i18n="auth_welcome_title">¡Bienvenido de nuevo!</h1>
        <p class="auth-split__subtitle" data-i18n="auth_welcome_subtitle">Accedé a tu cuenta para seguir contribuyendo a un futuro más limpio para todos.</p>
        <div class="auth-split__illustration">
          <div class="icon-circle"><i class="fa-solid fa-recycle"></i></div>
        </div>
      </div>

      <div class="auth-split__form">
        <div class="auth-card">
          <div class="auth-card__icon"><i class="fa-solid fa-lock"></i></div>
          <h1 class="auth-card__title" data-i18n="auth_login_title">Iniciar sesión</h1>
          <p class="auth-card__subtitle" data-i18n="auth_login_subtitle">Ingresá con tu cuenta para continuar</p>

          <form th:action="@{/auth/login}" method="post" class="auth-form">
            <div class="form-group">
              <label for="username" data-i18n="auth_username">Usuario</label>
              <div class="input-icon">
                <i class="fa-solid fa-user" aria-hidden="true"></i>
                <input type="text" id="username" name="username" required autofocus placeholder=" " class="form-input">
              </div>
            </div>
            <div th:replace="~{fragments/password-field :: field('password', 'password', null, null)}"></div>
            <button type="submit" class="btn btn--primary btn--block btn--lg" data-i18n="auth_login_button">Entrar</button>

            <div class="auth-divider" data-i18n="auth_or">o</div>

            <a th:href="@{/auth/register}" class="btn btn--outline btn--block btn--lg">
              <i class="fa-solid fa-user-plus"></i>
              <span data-i18n="auth_register_link">Registrarse</span>
            </a>
          </form>

          <p class="auth-card__footer">
            <span data-i18n="auth_no_account">¿No tenés cuenta?</span>
            <a th:href="@{/auth/register}" data-i18n="auth_register_link">Registrarse</a>
          </p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>

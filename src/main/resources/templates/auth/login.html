<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Iniciar sesión</title></head>
<body>
  <main layout:fragment="content">
    <div class="page page--narrow center">
      <div class="card">
        <h1 class="card__title" data-i18n="auth_login_title">Iniciar sesión</h1>
        <p class="card__subtitle" data-i18n="auth_login_subtitle">Entrá para ver y gestionar tus solicitudes.</p>

        <form th:action="@{/auth/login}" method="post" class="stack">
          <div class="field">
            <label for="username" data-i18n="auth_username">Usuario</label>
            <input type="text" id="username" name="username" required autofocus class="input" placeholder=" ">
          </div>
          <div th:replace="~{fragments/password-field :: field('password', 'password', null, null)}"></div>
          <button type="submit" class="btn btn--primary btn--block" data-i18n="auth_login_button">Entrar</button>
          <a th:href="@{/auth/register}" class="btn btn--outline btn--block">
            <i class="fa-solid fa-user-plus"></i>
            <span data-i18n="auth_register_link">Registrarse</span>
          </a>
        </form>

        <p class="card__footer">
          <span data-i18n="auth_no_account">¿No tenés cuenta?</span>
          <a th:href="@{/auth/register}" data-i18n="auth_register_link">Registrarse</a>
        </p>
      </div>
    </div>
  </main>
</body>
</html>

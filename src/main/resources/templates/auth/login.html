<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/app-layout}">
<head>
  <title th:text="#{login.title}">Iniciar Sesión</title>
</head>
<body>
<main layout:fragment="content">
  <div class="auth-page">
    <div class="auth-card auth-card--narrow">
      <div th:if="${param.success}" th:replace="~{fragments/components/alerts :: success(#{login.success})}"></div>
      <div th:if="${param.logout}" th:replace="~{fragments/components/alerts :: success(#{login.logout})}"></div>
      <div th:if="${param.error}" th:replace="~{fragments/components/alerts :: error(#{login.error})}"></div>

      <div th:replace="~{fragments/auth/login-form :: loginForm}"></div>
    </div>
  </div>
</main>
</body>
</html>

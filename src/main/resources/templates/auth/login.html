<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Residuo Sólido — Iniciar sesión</title>
</head>
<body>
  <main layout:fragment="content">
    <div class="page page--narrow auth-section">
      <div class="auth-card">
        <h1 class="auth-card__title" data-i18n="auth_login_title">Iniciar sesión</h1>
        <p class="auth-card__subtitle" data-i18n="auth_login_subtitle">Ingresá con tu cuenta para continuar</p>

        <div th:if="${param.error != null}" class="alert alert--error" role="alert">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span th:text="${#messages.msgOrNull('login.error') ?: 'Usuario o contraseña incorrectos.'}"></span>
        </div>

        <div th:if="${param.success != null}" class="alert alert--success" role="alert">
          <i class="fa-solid fa-circle-check"></i>
          <span th:text="${#messages.msgOrNull('login.success') ?: 'Registro exitoso. Iniciá sesión.'}"></span>
        </div>

        <form th:action="@{/auth/login}" method="post" class="auth-form">
          <div class="form-group">
            <label for="username" data-i18n="auth_username">Usuario</label>
            <input type="text" id="username" name="username" required autofocus
                   placeholder="Ej: juan_perez" class="form-input">
          </div>
          <div class="form-group">
            <label for="password" data-i18n="auth_password">Contraseña</label>
            <input type="password" id="password" name="password" required
                   placeholder="••••••••" class="form-input">
          </div>
          <button type="submit" class="btn btn--primary btn--block btn--lg" data-i18n="auth_login_button">Entrar</button>
        </form>

        <p class="auth-card__footer">
          <span data-i18n="auth_no_account">¿No tenés cuenta?</span>
          <a th:href="@{/auth/register}" data-i18n="auth_register_link">Registrarse</a>
        </p>
      </div>
    </div>
  </main>
</body>
</html>

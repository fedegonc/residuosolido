<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Iniciar sesión</title></head>
<body>
  <main layout:fragment="content">
    <div class="page page--center">
      <div class="split">
        <section class="hero">
          <h1 class="card__title" data-i18n="auth_login_title">Iniciar sesión</h1>
          <p class="card__subtitle" data-i18n="auth_login_subtitle">Entrá para ver y gestionar tus solicitudes.</p>

          <form th:action="@{/entrar}" method="post" class="stack">
            <!-- queda inline: es el único campo con autofocus (forms::text no lo modela) -->
            <div class="field">
              <label for="username" data-i18n="auth_name">Nombre</label>
              <input type="text" id="username" name="username" required autofocus class="input" placeholder=" ">
            </div>
            <div th:replace="~{fragments/forms :: pin('password', 'password', null, null)}"></div>
            <div th:replace="~{fragments/forms :: submit(null, 'auth_login_button', 'Entrar', 'btn--primary btn--block')}"></div>
          </form>

          <p class="card__footer">
            <span data-i18n="auth_no_account">¿No tenés cuenta?</span>
            <a th:href="@{/registrarse}" data-i18n="auth_register_link">Registrarse</a>
          </p>
        </section>

        <section class="hero hero--dark">
          <h2 class="hero__title hero__title--sm" data-i18n="auth_guest_title">¿Buscás tu solicitud?</h2>
          <p class="hero__subtitle" data-i18n="auth_guest_desc">Si pediste sin cuenta, buscala con tu teléfono y el código que te dimos.</p>
          <div class="hero__cta">
            <a th:href="@{/rastrear}" class="btn btn--light">
              <svg class="icon"><use href="/images/icons.svg#magnifying-glass"/></svg>
              <span data-i18n="cta_track">Buscar mi solicitud</span>
            </a>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>

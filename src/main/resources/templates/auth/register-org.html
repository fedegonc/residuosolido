<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Registro de organización</title></head>
<body>
  <main layout:fragment="content">
    <div class="page page--center page--form">
      <div class="split">
        <section class="hero">
          <h1 class="card__title" data-i18n="auth_register_org_title">Registrar organización</h1>
          <p class="card__subtitle" data-i18n="auth_register_org_subtitle">Creá la cuenta de tu organización para recibir solicitudes de recolección.</p>

          <form th:action="@{/registrarse-organizacion}" method="post" class="stack" th:object="${user}" novalidate>
            <div class="field-group" th:classappend="${#fields.hasErrors('username')} ? 'field-group--error'">
              <div th:replace="~{fragments/forms :: text('username', 'username', 'text', 'auth_org_name', 'Nombre de la organización', 'auth_org_name_placeholder', 'Ej: Cooperativa Verde', true, ${user.username})}"></div>
              <span class="field__error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}" role="alert"></span>
            </div>
            <div class="field-group" th:classappend="${#fields.hasErrors('tipo')} ? 'field-group--error'">
              <label class="field__label" for="tipo" data-i18n="auth_org_type">Tipo de organización</label>
              <select id="tipo" th:field="*{tipo}" class="select" required>
                <option value="" disabled data-i18n="auth_org_type_placeholder">Elegí una opción</option>
                <option th:each="t : ${orgTypes}"
                        th:value="${t.name()}"
                        th:text="${t.name()}"
                        th:attr="data-i18n='org_type_' + ${t.name()}"></option>
              </select>
              <span class="field__error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" role="alert"></span>
            </div>
            <div class="field-group" th:classappend="${#fields.hasErrors('phoneNational')} ? 'field-group--error'">
              <div th:replace="~{fragments/forms :: phone('phone', 'countryCode', 'phoneNational', 'ddd', 'auth_phone', 'Número de celular', true, ${user.phoneNational}, ${user.countryCode}, ${user.ddd}, null, null)}"></div>
              <span class="field__error" th:if="${#fields.hasErrors('phoneNational')}" th:errors="*{phoneNational}" role="alert"></span>
            </div>
            <div class="field-group" th:classappend="${#fields.hasErrors('password')} ? 'field-group--error'">
              <div th:replace="~{fragments/forms :: pin('password', 'password', 'auth_pin_hint', '4 dígitos, para identificarte rápido')}"></div>
              <span class="field__error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}" role="alert"></span>
            </div>
            <div th:replace="~{fragments/forms :: submit(null, 'auth_register_button', 'Registrarse', 'btn--primary btn--block')}"></div>
            <p class="card__footer">
              <span data-i18n="auth_register_as_citizen">¿Sos ciudadano?</span>
              <a th:href="@{/registrarse}" data-i18n="auth_register_citizen_link">Registrate acá</a>
            </p>
          </form>

          <p class="card__footer">
            <span data-i18n="auth_have_account">¿Ya tenés cuenta?</span>
            <a th:href="@{/entrar}" data-i18n="auth_login_link">Iniciar sesión</a>
          </p>
        </section>

        <div th:replace="~{fragments/forms :: altCta('auth_have_account', 'auth_login_subtitle', '/entrar', 'right-to-bracket', 'nav_login')}"></div>
      </div>
    </div>
  </main>
</body>
</html>

<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Registro</title></head>
<body>
  <main layout:fragment="content">
    <div class="page page--center">
      <div class="split">
        <section class="hero">
          <h1 class="card__title" data-i18n="auth_register_title">Crear cuenta</h1>
          <p class="card__subtitle" data-i18n="auth_register_subtitle">Creá una cuenta para pedir recolección y seguir el estado.</p>

          <form th:action="@{/registrarse}" method="post" class="stack">
            <div th:replace="~{fragments/forms :: text('username', 'username', 'text', 'auth_name', 'Nombre', 'auth_name_placeholder', 'Ej: Ana García', true, ${user.username})}"></div>
            <div th:replace="~{fragments/forms :: phone('phone', 'countryCode', 'phoneNational', 'ddd', 'auth_phone', 'Número de celular', true, ${user.phoneNational}, ${user.countryCode}, ${user.ddd}, null, null)}"></div>
            <div th:replace="~{fragments/forms :: pin('password', 'password', 'auth_pin_hint', '4 dígitos, para identificarte rápido')}"></div>
            <div th:replace="~{fragments/forms :: check('isOrganization', 'isOrganization', 'auth_is_organization', 'Soy una cooperativa o reciclador', 'auth_is_organization_hint', 'Marcá esta opción si querés recibir solicitudes de recolección.')}"></div>
            <div th:replace="~{fragments/forms :: submit(null, 'auth_register_button', 'Registrarse', 'btn--primary btn--block')}"></div>
          </form>

          <p class="card__footer">
            <span data-i18n="auth_have_account">¿Ya tenés cuenta?</span>
            <a th:href="@{/entrar}" data-i18n="auth_login_link">Iniciar sesión</a>
          </p>
        </section>

        <section class="hero hero--dark">
          <h2 class="hero__title hero__title--sm" data-i18n="auth_nocount_title">¿No querés crear cuenta?</h2>
          <p class="hero__subtitle" data-i18n="auth_nocount_desc">Podés pedir la recolección solo con tu nombre y celular — te damos un código para seguirla.</p>
          <div class="hero__cta">
            <a th:href="@{/solicitar}" class="btn btn--light">
              <svg class="icon"><use href="/images/icons.svg#arrow-right"/></svg>
              <span data-i18n="auth_nocount_cta">Pedir sin cuenta</span>
            </a>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>

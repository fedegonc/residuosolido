<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Registro</title></head>
<body>
  <main layout:fragment="content">
    <div class="page page--narrow center">
      <div class="card">
        <h1 class="card__title" data-i18n="auth_register_title">Crear cuenta</h1>
        <p class="card__subtitle" data-i18n="auth_register_subtitle">Creá una cuenta para pedir recolección y seguir el estado.</p>

        <form th:action="@{/auth/register}" th:object="${user}" method="post" class="stack">
          <div class="field">
            <label for="username" data-i18n="auth_username">Usuario</label>
            <input type="text" id="username" th:field="*{username}" required class="input" placeholder=" ">
          </div>
          <div class="field">
            <label for="email" data-i18n="auth_email">Email</label>
            <input type="email" id="email" th:field="*{email}" required class="input" placeholder="tu@email.com">
          </div>
          <div th:replace="~{fragments/password-field :: field('password', 'password', 'auth_password_hint', 'Mínimo 8 caracteres')}"></div>
          <div class="field">
            <label class="row">
              <input type="checkbox" id="isOrganization" name="isOrganization" value="true">
              <span data-i18n="auth_is_organization">Soy una cooperativa o reciclador</span>
            </label>
            <span class="hint" data-i18n="auth_is_organization_hint">Marcá esta opción si querés recibir solicitudes de recolección.</span>
          </div>
          <button type="submit" class="btn btn--primary btn--block" data-i18n="auth_register_button">Registrarse</button>
          <a th:href="@{/auth/login}" class="btn btn--outline btn--block">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span data-i18n="auth_login_link">Iniciar sesión</span>
          </a>
        </form>

        <p class="card__footer">
          <span data-i18n="auth_have_account">¿Ya tenés cuenta?</span>
          <a th:href="@{/auth/login}" data-i18n="auth_login_link">Iniciar sesión</a>
        </p>
      </div>
    </div>
  </main>
</body>
</html>

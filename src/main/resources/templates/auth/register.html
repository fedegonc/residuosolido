<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/app-layout}">
<head>
  <title th:text="#{register.title}">Crear Cuenta</title>
</head>
<body>
<main layout:fragment="content">

  <div class="auth-page">
    <div class="auth-card">
      <header class="auth-card__header">
        <h2 class="auth-card__title" th:text="#{register.title}">Crear Cuenta</h2>
        <p class="auth-card__subtitle" th:text="#{register.subtitle}">Registra tus datos para empezar.</p>
      </header>

      <div th:if="${error}" th:replace="~{fragments/components/alerts :: error(${error})}"></div>
      <div th:if="${success}" th:replace="~{fragments/components/alerts :: success(${success})}"></div>

      <form th:action="@{/auth/register}" method="post" class="form">
        <div class="content-grid">
          <h3 class="text-xs font-semibold text-gray-500" th:text="#{register.account_section}">Datos de la cuenta</h3>
          <div class="form__row form__row--2">
            <div class="field">
              <label class="field__label" for="username" th:text="#{register.username}">Usuario</label>
              <input type="text" id="username" name="username" required class="input">
            </div>
            <div class="field">
              <label class="field__label" for="email" th:text="#{register.email}">Email</label>
              <input type="email" id="email" name="email" required class="input">
            </div>
            <div class="field">
              <label class="field__label" for="firstName" th:text="#{register.first_name}">Nombre</label>
              <input type="text" id="firstName" name="firstName" required class="input">
            </div>
            <div class="field">
              <label class="field__label" for="lastName" th:text="#{register.last_name}">Apellido</label>
              <input type="text" id="lastName" name="lastName" required class="input">
            </div>
          </div>
        </div>

        <div class="content-grid">
          <h3 class="text-xs font-semibold text-gray-500" th:text="#{register.security_section}">Seguridad</h3>
          <div class="form__row form__row--2">
            <div class="field">
              <label class="field__label" for="password" th:text="#{register.password}">Contraseña</label>
              <div class="password-field" data-password-container>
                <input type="password" id="password" name="password" minlength="3" required
                       class="input" th:placeholder="#{register.password_placeholder}">
                <button type="button" class="password-field__toggle"
                        data-password-toggle data-target="password"
                        th:aria-label="#{aria.password.toggle}" aria-pressed="false">
                  <i class="fa-solid fa-eye" aria-hidden="true"></i>
                  <span class="sr-only" th:text="#{auth.password.toggle}">Mostrar u ocultar contraseña</span>
                </button>
              </div>
            </div>
            <div class="field">
              <label class="field__label" for="confirmPassword" th:text="#{register.confirm_password}">Confirmar</label>
              <div class="password-field" data-password-container>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                       class="input" th:placeholder="#{register.confirm_password_placeholder}">
                <button type="button" class="password-field__toggle"
                        data-password-toggle data-target="confirmPassword"
                        th:aria-label="#{aria.password.toggle}" aria-pressed="false">
                  <i class="fa-solid fa-eye" aria-hidden="true"></i>
                  <span class="sr-only" th:text="#{auth.password.toggle}">Mostrar u ocultar contraseña</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="content-grid">
          <h3 class="text-xs font-semibold text-gray-500" th:text="#{register.account_type_section}">Tipo de cuenta</h3>
          <div class="info-box info-box--blue">
            <label class="flex gap-3 items-start">
              <input type="checkbox" id="isOrganization" name="isOrganization" value="true"
                     onchange="document.getElementById('orgHint').classList.toggle('is-hidden', !this.checked)">
              <div>
                <span class="text-sm font-semibold text-gray-900" th:text="#{register.organization_label}">Registro de organización</span>
                <span class="text-xs text-gray-600 block mt-1" th:text="#{register.organization_hint}">Actívalo si eres un centro de acopio.</span>
                <p id="orgHint" class="is-hidden text-xs text-blue-700 mt-1" th:text="#{register.organization_description}">Completa la información de contacto de tu organización después del registro.</p>
              </div>
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn--green btn--block" th:text="#{register.submit}">Crear Cuenta</button>
      </form>

      <div class="mt-4 text-center text-sm text-gray-600">
        <span th:text="#{register.has_account}">¿Ya tienes cuenta?</span>
        <a href="/auth/login" class="link link--green" th:text="#{register.login_link}">Iniciar Sesión</a>
      </div>
    </div>
  </div>

</main>
</body>
</html>

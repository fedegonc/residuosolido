<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title layout:title-pattern="$LAYOUT_TITLE — $CONTENT_TITLE">Eco Solicitud</title>
  <meta name="description" content="Eco Solicitud — Plataforma de recolección de reciclables en la frontera Uruguay-Brasil. Conecta ciudadanos con organizaciones de acopio.">
  <meta name="author" content="Federico">
  <meta name="theme-color" content="#2d6a4f">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Eco Solicitud">
  <meta property="og:description" content="Plataforma de recolección de reciclables en la frontera Uruguay-Brasil.">
  <meta property="og:locale" th:content="${#locale.language}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Eco Solicitud">
  <meta name="twitter:description" content="Plataforma de recolección de reciclables en la frontera Uruguay-Brasil.">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/fonts.css}">
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
  <link rel="manifest" th:href="@{/manifest.webmanifest}">
  <meta name="theme-color" content="#2d6a4f">
  <script th:src="@{/js/i18n.js(l=${#locale.language})}"></script>
  <th:block layout:fragment="extraHead"></th:block>
</head>
<body class="app-body">
  <a href="#main-content" class="skip-link" data-i18n="skip_content">Saltar al contenido</a>

  <header class="site-header">
    <div th:replace="~{fragments/navbar :: nav}"></div>
  </header>

  <div th:replace="~{fragments/ui :: msg('success', ${successMessage})}" th:if="${successMessage != null}"></div>
  <div th:replace="~{fragments/ui :: msg('error', ${errorMessage})}" th:if="${errorMessage != null}"></div>
  <div th:replace="~{fragments/ui :: msg('warning', ${warningMessage})}" th:if="${warningMessage != null}"></div>
  <div th:replace="~{fragments/ui :: msg('info', ${infoMessage})}" th:if="${infoMessage != null}"></div>

  <main id="main-content" class="app-main" layout:fragment="content"></main>

  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__brand"><svg class="icon"><use href="/images/icons.svg#recycle"/></svg> Eco Solicitud</span>
      <nav class="footer__links" aria-label="Información">
        <a href="/sobre-catadores">Sobre los catadores</a>
        <a href="https://docs.google.com/document/d/1LNOGjk2HbU49zUnKQ6cMVhqFjj4WriRQsG8U7t2K2Ic/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Tesis</a>
      </nav>
      <span class="footer__copy">&copy; <time th:text="${#temporals.format(#temporals.createNow(),'yyyy')}">2026</time> <span data-i18n="footer_rights">Todos los derechos reservados.</span></span>
    </div>
  </footer>

  <script th:src="@{/js/app.js}"></script>
  <th:block layout:fragment="pageScripts"></th:block>
</body>
</html>

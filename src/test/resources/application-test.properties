# ========================================
# CONFIGURACIÓN DE TESTING
# ========================================

# La app usa MongoDB (no H2/JPA). Los tests de integración usan
# mongodb://localhost:27017/testdb configurado directamente en cada
# test con @SpringBootTest(properties=...). Este archivo solo contiene
# configuración general de logging y Thymeleaf para tests.

# Logging
logging.level.root=INFO
logging.level.com.residuosolido.app=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Thymeleaf
spring.thymeleaf.cache=false

# Multipart (file uploads)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + PMD + Cobertura
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar (sin tests)
        run: mvn clean compile -B -q

      - name: Tests unitarios + JaCoCo
        run: mvn test -B
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/testdb-ci

      - name: PMD (análisis estático)
        run: mvn pmd:pmd pmd:check -B

      - name: Subir reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Subir reporte PMD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: target/site/pmd.html

  build-docker:
    name: Build Docker (smoke test)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imagen Docker
        run: docker build -t residuosolido:ci .
